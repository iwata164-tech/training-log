<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101317">
<title>筋トレ記録</title>
<style>
:root{--bg:#101317;--card:#1a1f26;--card2:#222933;--line:#2c343f;--text:#e9eef3;--muted:#8d98a6;--acc:#ff7a1a;--acc2:#ffb066;--ok:#3ecf8e;--warn:#f5b84b;--bad:#ff5d5d;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.resting{padding-bottom:calc(132px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#hud{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;min-height:36px;padding:calc(3px + env(safe-area-inset-top)) 12px 3px;background:rgba(16,19,23,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#hud-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text);padding:5px 2px;white-space:nowrap;overflow:hidden;text-align:left}
.badge{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:rgba(62,207,142,.4)}
.badge.warn{color:var(--warn);border-color:rgba(245,184,75,.5)}
.badge.bad{color:var(--bad);border-color:rgba(255,93,93,.5)}
.badge.busy{color:var(--acc2)}
.badge.muted{color:var(--muted)}
main{padding:12px 14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.ex-head{display:flex;align-items:center;gap:8px}
.ex-head h2{margin:0;font-size:22px;flex:1;min-width:0}
.tag{font-size:12px;color:var(--muted);background:var(--card2);padding:3px 8px;border-radius:99px;white-space:nowrap}
.x{width:36px;height:36px;border-radius:50%;color:var(--muted);flex:none}
.x:active{background:var(--card2)}
.sugg{margin:12px 0 8px;padding:12px;border-radius:12px;background:linear-gradient(135deg,rgba(255,122,26,.18),rgba(255,122,26,.05));border:1px solid rgba(255,122,26,.35)}
.sugg.up{background:linear-gradient(135deg,rgba(62,207,142,.2),rgba(62,207,142,.05));border-color:rgba(62,207,142,.4)}
.sugg.down{background:linear-gradient(135deg,rgba(245,184,75,.2),rgba(245,184,75,.05));border-color:rgba(245,184,75,.45)}
.lbl{font-size:12px;color:var(--muted);margin:6px 0 4px}
.sugg .lbl{margin:0}
.goal{font-size:22px;font-weight:700;letter-spacing:.01em}
.why{font-size:13px;color:#c9d2dc;margin-top:2px}
.last,.note{font-size:13px;color:var(--muted);margin:4px 0}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.inputs label{font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:stretch;margin-top:4px;background:var(--card2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{width:44px;font-size:22px;color:var(--acc2)}
.stepper button:active{background:#2d3542}
.stepper input{color:var(--text);flex:1;min-width:0;width:100%;text-align:center;font-size:24px;font-weight:700;background:none;border:0;padding:8px 0;outline:none}
.stepper input::-webkit-inner-spin-button{display:none}
.primary{display:block;width:100%;padding:14px;border-radius:12px;background:var(--acc);color:#1a0d00;font-weight:700;font-size:17px}
.primary:active{filter:brightness(.9)}
.primary.danger{background:var(--bad);color:#fff}
.ghost{display:block;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);text-align:center;margin-top:10px}
.progress{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.progress span:last-child{margin-left:6px}
.empty p{margin:0 0 8px;color:#c9d2dc}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:14px}
.chip.on{background:#e9eef3;color:#101317;border-color:#e9eef3;font-weight:700}
.sec{font-size:15px;margin:18px 2px 8px}
.sec small{color:var(--muted);font-weight:400;margin-left:6px}
.muted{color:var(--muted)}
.pad{padding:8px 4px}
.small{font-size:13px}
.err{color:var(--bad)}
.log{padding:10px 14px}
.log-title{font-weight:700;padding:0;text-align:left;color:var(--acc2)}
.log ol{margin:6px 0 0;padding-left:22px}
.log li{display:flex;align-items:center;justify-content:space-between}
.log li::marker{color:var(--muted)}
.log li .x{width:30px;height:30px}
.picker .filters{position:static}
.filters{position:sticky;top:calc(37px + env(safe-area-inset-top));z-index:2;background:var(--bg);padding-bottom:4px}
.exlist{list-style:none;margin:0;padding:0}
.exlist li button{display:flex;flex-direction:column;width:100%;text-align:left;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.exlist .nm{font-weight:700}
.exlist .meta{font-size:12px;color:var(--muted)}
.day h3{margin:0 0 8px;font-size:16px}
.day h3 small{color:var(--muted);font-weight:400}
.hrow{padding:6px 0;border-top:1px solid var(--line)}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pill{font-size:13px;padding:3px 9px;border-radius:8px;background:var(--card2)}
.vol{font-size:12px;color:var(--muted);margin-top:2px}
.field{display:block;font-size:13px;color:var(--muted);margin:8px 0}
.field input,.field select{color:var(--text);display:block;width:100%;margin-top:4px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:8px;margin-top:8px}
.toggle input{width:20px;height:20px;accent-color:var(--acc)}
.card h3{margin:0 0 6px;font-size:16px}
.filebtn{cursor:pointer;font-size:15px}
/* 入力バー */
.cmdbar{padding:0 0 12px}
.cmdbar[hidden]{display:none}
.cmdbar form{display:flex;gap:8px;align-items:center;max-width:640px;margin:0 auto}
.cmdbar input{flex:1;min-width:0;padding:13px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:16px;outline:none}
.cmdbar input:focus{border-color:var(--acc2)}
#mic{width:58px;height:58px;border-radius:50%;background:var(--acc);color:#1a0d00;flex:none;display:grid;place-items:center;box-shadow:0 4px 16px rgba(255,122,26,.35)}
#mic svg{width:26px;height:26px}
#mic.on{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,93,93,.6)}100%{box-shadow:0 0 0 18px rgba(255,93,93,0)}}
@media (prefers-reduced-motion:reduce){#mic.on{animation:none}}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;background:#0c0f12;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted)}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--text);box-shadow:inset 0 2px 0 var(--text)}
#toast{position:fixed;left:6px;right:6px;top:calc(2px + env(safe-area-inset-top));transform:translateY(-130%);min-height:32px;display:flex;align-items:center;justify-content:center;text-align:center;padding:5px 12px;border-radius:10px;background:#2b333e;border:1px solid #3d4856;color:var(--text);font-size:14px;line-height:1.35;opacity:0;pointer-events:none;transition:.25s;z-index:28;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:none;pointer-events:auto}
#modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.sheet{width:100%;max-width:640px;background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet h3{margin:0 0 6px}
.sheet .row2{margin-top:12px}
.sheet .row2 .ghost{margin-top:0}

.plate-btn{display:block;width:100%;margin:-2px 0 10px;padding:10px;border-radius:12px;border:1px dashed #3a4452;color:var(--acc2);font-size:14px}
.orm{background:var(--card2);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.orm:empty{display:none}
.orm-main{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.orm-main .lbl{margin:0}
.orm-main b{font-size:20px}
.orm-past{color:#c9d2dc;margin-top:2px}
.orm-past small{color:var(--muted);margin-left:3px}
.orm-calc{color:var(--muted);margin-top:4px}
.pr{color:#1a0d00;background:var(--ok);font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px}
.log-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.orm-tag{font-size:12px;color:var(--muted);background:var(--card2);padding:2px 8px;border-radius:99px;white-space:nowrap}
.orm-tag.pr{background:rgba(62,207,142,.18);color:var(--ok)}
.log li .row{flex:1;text-align:left;padding:6px 0;display:flex;align-items:baseline;gap:4px}
.log li .row small{color:var(--muted);font-size:12px}
.log li .row .pen{margin-left:auto;color:var(--muted);font-size:13px;padding-right:6px}
.pd-tabs{margin-bottom:6px}
.pd-total{font-size:40px;font-weight:800;text-align:center;margin:6px 0}
.pd-total small{font-size:18px;margin-left:2px}
.pd-total span{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.barvis{display:flex;align-items:center;height:90px;margin:4px 0 6px;padding-left:10px}
.barvis .sleeve{width:70px;height:10px;background:#9aa3ad;border-radius:3px}
.barvis i{display:block;width:12px;margin-left:2px;border-radius:3px;border:1px solid rgba(0,0,0,.35)}
.barvis .cap{width:26px;height:10px;background:#9aa3ad;border-radius:0 3px 3px 0;margin-left:2px}
.plates{display:flex;flex-wrap:wrap;gap:8px}
.plate{width:56px;height:56px;border-radius:50%;font-weight:800;font-size:15px;box-shadow:inset 0 0 0 5px rgba(0,0,0,.18)}
.plate:active{transform:scale(.94)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.steps .chip{padding:11px 0;text-align:center}
.danger-t{color:var(--bad)}
.sheet{max-height:88vh;overflow:auto}

.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:14px;color:var(--muted)}
.trendbox{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.trend-tg{color:var(--acc2);font-size:14px;padding:4px 0}
.trend{margin-top:6px}
.trend .chips{margin:8px 0 2px}
.trend .chip{padding:5px 10px;font-size:13px}
.seg.sm{margin:0}
.seg.sm button{padding:6px 0;font-size:13px}
.upc{color:var(--ok)}.dnc{color:var(--warn)}
.seg button.on{background:#3b4654;color:#fff;font-weight:700}
.pnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.jump{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:-4px 0 12px}
.jump select,.jump input{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;color-scheme:dark}
.pnav b{font-size:17px}
.pnav .x{font-size:26px;color:var(--acc2)}
.pnav .x:disabled{opacity:.25}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpis span{display:block;font-size:12px;color:var(--muted)}
.kpis b{font-size:22px;display:block;line-height:1.3}
.kpis em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:2px}
.exrow .pv{grid-column:1/3;font-size:11px;color:var(--muted)}
.kpis b small{font-size:12px;font-weight:400;margin-left:1px}
.cmp{margin:4px 2px 12px}
.dlt{font-size:12px;color:var(--muted);white-space:nowrap}
.dlt.up{color:var(--ok)}
.dlt.down{color:var(--warn)}
.chart{width:100%;height:auto;display:block;margin-top:6px;overflow:visible}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .bar{fill:#5b4a3d}
.chart .bar.on{fill:var(--acc)}
.chart .xl{fill:var(--muted);font-size:10px;text-anchor:middle}
.chart .xl.on{fill:var(--text);font-weight:700}
.chart .vl{fill:var(--text);font-size:11px;font-weight:700;text-anchor:middle}
.chart .ln{fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round}
.chart .pt{fill:var(--acc);stroke:var(--card);stroke-width:2}
.chart .pt.on{fill:#fff;stroke:var(--acc)}
.chart .hb{cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--muted)}
.cal .cd{min-height:44px;border-radius:8px;background:var(--card2);padding:3px 1px;display:flex;flex-direction:column;align-items:center}
.cal .cd b{font-size:12px;font-weight:400;color:var(--muted)}
.cal .cd.on{background:rgba(255,122,26,.22);outline:1px solid rgba(255,122,26,.5)}
.cal .cd.on b{color:var(--text);font-weight:700}
.cal .cd i{font-style:normal;font-size:9px;color:var(--acc2);line-height:1.2}
.cal .cd.td{box-shadow:inset 0 0 0 2px var(--ok)}
.pbar{display:grid;grid-template-columns:3.2em 1fr 2em 3.4em;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.pbar div{height:10px;background:var(--card2);border-radius:5px;overflow:hidden}
.pbar i{display:block;height:100%;background:#7c8da3;border-radius:0 4px 4px 0}
.pbar b{text-align:right}
.exrow{display:grid;grid-template-columns:1fr auto;gap:0 8px;width:100%;text-align:left;padding:9px 4px;border-top:1px solid var(--line);font-size:13px}
.exrow .nm{font-weight:700;font-size:15px;grid-column:1/3}
.exrow span:nth-child(2){color:var(--muted)}
.exrow .o{text-align:right}
.exrow.on .nm{color:var(--acc2)}
.card h3 small{font-weight:400;font-size:12px}

.sess{border-color:#3b4654}
.ex-head h2.sm{font-size:18px}
.plist{list-style:none;margin:8px 0 0;padding:0}
.plist li button{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 6px;border-radius:10px}
.plist li.cur button{background:rgba(255,255,255,.07)}
.plist .ck{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--card2);color:var(--muted)}
.plist li.done .ck{background:var(--ok);color:#06200f;font-weight:700}
.plist li.done .nm{color:var(--muted);text-decoration:line-through}
.plist li.cur .nm{color:var(--acc2);font-weight:700}
.plist .meta{font-size:12px;color:var(--muted)}
.ghost.slim{padding:9px;font-size:14px;color:var(--acc2)}

.pats h3{margin:0}
.patrow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0}
.patrow:first-of-type{border-top:0}
.pname{flex:1;text-align:left;display:flex;flex-direction:column;min-width:0}
.pname small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pe-list{margin:4px 0;padding-left:22px}
.pe-list li{display:flex;align-items:center;gap:2px}
.pe-list li span{flex:1}
.pe-list .x{width:32px;height:32px}
.pe-list .x:disabled{opacity:.25}
.pe-add{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:var(--bg)}
.pe-add .ex-head{justify-content:space-between}
.pe-add .exlist button{position:relative}
.pe-add .exlist .nm{display:flex;justify-content:space-between;gap:8px}
.pe-add .exlist em{font-style:normal;font-size:13px;color:var(--acc2);white-space:nowrap}
.pe-add .exlist button.added{border-color:rgba(62,207,142,.5);background:rgba(62,207,142,.08)}
.pe-add .exlist button.added em{color:var(--ok)}
.addrow select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:16px;margin:6px 0 4px}
.ghost:disabled{opacity:.4}

.hero{display:grid;grid-template-columns:44% 1fr;gap:10px;align-items:center;background:radial-gradient(circle at 30% 40%,#2a2218,var(--card) 70%)}
.hero-svg{width:100%;height:auto;display:block}
.hero-info .ttl{font-size:12px;color:var(--acc2)}
.hero-info .lvl{font-size:15px}.hero-info .lvl b{font-size:30px}
.xpbar,.mbar,.hpbar{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin:4px 0}
.xpbar i,.mbar i{display:block;height:100%;background:#5aa9ff;border-radius:4px}
.mbar i{background:#38c6b4}
.coin{font-size:18px;margin:8px 0 6px}.coin b{color:#f2c230}
.stats{display:flex;flex-direction:column;gap:2px;font-size:13px;color:#c9d2dc}
.mrow{display:grid;grid-template-columns:3.6em 1fr 2.6em 5em;align-items:center;gap:8px;font-size:13px;margin:8px 0}
.mrow small{color:var(--muted);text-align:right}
.coinlog{list-style:none;margin:6px 0;padding:0;font-size:13px}
.coinlog li{display:grid;grid-template-columns:4.6em 1fr auto;gap:6px;padding:5px 0;border-top:1px solid var(--line)}
.coinlog b{color:#f2c230}
.eqrow{padding:8px 0;border-top:1px solid var(--line)}
.eqh{display:flex;justify-content:space-between;margin-bottom:6px;font-size:14px}
.eqh span{color:var(--muted)}
.chip.sp{border-color:#b38cff;color:#d6c2ff}
.chip.sp.on{background:#7b2fd0;color:#fff;border-color:#7b2fd0}
.chip small{opacity:.75;font-size:11px}
.shoprow{display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;padding:9px 4px;border-top:1px solid var(--line)}
.shoprow .ic{font-size:22px;text-align:center}
.shoprow .nm small{display:block;color:var(--muted);font-size:12px}
.shoprow .pr{font-weight:700;color:#f2c230}
.shoprow .pr.ng{color:var(--muted)}
.shoprow .pr.own{color:var(--ok);font-weight:400;font-size:13px}
.shopdlg .pv{width:150px;margin:0 auto}
.shopdlg h3,.shopdlg p{text-align:center;margin:4px 0}
.primary:disabled{background:#4a3a2c;color:#9c8b7a}
.bosscard{text-align:center}
.bicon{width:132px;margin:0 auto}
.bstats{display:flex;justify-content:center;gap:14px;margin:4px 0 8px}
.bosshp{max-width:260px;margin:0 auto 8px}.bosshp small{color:var(--muted);font-size:12px}
.wr{display:flex;justify-content:center;gap:8px;align-items:baseline;margin:6px 0 12px}.wr b{font-size:18px}
.blist{list-style:none;margin:0;padding:0}
.blist li{display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.blist li span:first-child{font-size:20px;text-align:center}
.blist .boss-svg{width:32px;height:32px}
.blist li small{color:var(--muted);font-size:12px}
.blist li.done small{color:var(--ok)}
.blist li.cur{color:var(--acc2);font-weight:700}
.blist li.lock{opacity:.5}
.battle .bt-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}
.bt-side .mini{width:90px;margin:0 auto}
.bt-boss{height:122px;display:grid;place-items:center;transition:.4s}
.bt-boss .boss-svg{width:112px;height:112px}
.bt-boss.down{filter:grayscale(1);opacity:.45;transform:rotate(14deg) translateY(8px)}
.bt-vs{font-weight:800;color:var(--acc)}
.hpbar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.hpbar.boss i{background:var(--bad)}
.bt-side small{color:var(--muted);font-size:12px}
.bt-log{height:92px;overflow:auto;background:var(--card2);border-radius:10px;padding:8px;margin:10px 0;font-size:13px}
.bt-log .me{color:#ffd2ad}.bt-log .en{color:#ffb3b3}
.bt-res{font-size:28px;font-weight:800;text-align:center}
.bt-res.win{color:#f2c230}.bt-res.lose{color:var(--muted)}
#bt-end p{text-align:center}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px) rotate(-4deg)}75%{transform:translateX(6px) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.hpbar i{transition:none}}

/* ---- 上部ステータス帯 ---- */
.hud-lv b{font-size:16px;margin-left:2px}
.hud-xp{flex:1;max-width:90px;min-width:30px;height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.hud-xp i{display:block;height:100%;background:#5aa9ff;transition:width .5s}
.hud-coin b{color:#f2c230;margin-left:2px;display:inline-block}
.hud-coin.bump b{animation:bump .3s}
.hud-wk{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px}
.hud-st{font-size:12px}
.wdots{display:inline-flex;gap:3px;vertical-align:middle}
.wdots i{width:9px;height:9px;border-radius:50%;border:1.5px solid #4a5563}
.wdots i.on{background:var(--ok);border-color:var(--ok)}
body.local #badge{display:none}
/* ---- 休憩タイマー ---- */
#rest{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:6;padding:6px 10px;pointer-events:none}
#rest[hidden]{display:none}
.rest-in{pointer-events:auto;max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:5px 5px 5px 14px;border-radius:12px;background:#243042;border:1px solid #3a4a61;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#rest-t{font-variant-numeric:tabular-nums;white-space:nowrap}
.rest-track{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
#rest-bar{display:block;height:100%;background:#5aa9ff}
.rest-in button{height:36px;min-width:36px;padding:0 10px;border-radius:9px;background:rgba(255,255,255,.09);font-size:13px}
#rest.done .rest-in{background:#1f4a35;border-color:var(--ok)}
#rest.done #rest-bar{background:var(--ok)}
/* ---- 記録した瞬間の演出 ---- */
#fx{position:fixed;inset:0;z-index:25;pointer-events:none;overflow:hidden}
.fx-pop{position:absolute;right:10px;bottom:calc(124px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;padding:6px 14px 6px 4px;border-radius:14px;background:rgba(26,31,38,.97);border:1px solid #f2c230;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:fxin .35s cubic-bezier(.2,1.4,.4,1) both}
.fx-char{width:60px}
.fx-gain{font-weight:800;color:#f2c230;font-size:18px;white-space:nowrap}
.fx-msg{font-size:13px;max-width:170px;line-height:1.35}
.fx-pop.big .fx-msg{max-width:none;margin-bottom:6px;color:#c9d2dc}
.fx-pop.big{left:50%;right:auto;bottom:auto;top:20%;flex-direction:column;padding:14px 24px 16px;text-align:center;pointer-events:auto;min-width:240px;animation-name:fxbig;transform:translateX(-50%);box-shadow:0 0 0 100vmax rgba(0,0,0,.35),0 0 40px rgba(242,194,48,.45)}
.fx-pop.big .fx-char{width:124px}
.fx-big{margin-bottom:6px}
.fx-big b{display:block;font-size:22px;color:#f2c230;letter-spacing:.04em}
.fx-big span{font-size:15px}
.fx-c{position:fixed;font-size:18px;margin:-10px 0 0 -10px;will-change:transform}
@keyframes fxin{from{opacity:0;transform:translateY(20px) scale(.8)}to{opacity:1;transform:none}}
@keyframes fxbig{from{opacity:0;transform:translateX(-50%) scale(.6)}to{opacity:1;transform:translateX(-50%)}}
@keyframes bump{50%{transform:scale(1.4)}}
.hero-svg.idle{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scaleY(1.018)}}
/* ---- 冒険 ---- */
.boss-svg{display:block;width:100%;height:auto}
.hero .weekrow{grid-column:1/3;display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;font-size:13px;border-top:1px solid var(--line);padding-top:8px;color:#c9d2dc}
.chal{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 14px 8px 10px;margin:14px 0 0;border-radius:var(--r);background:linear-gradient(135deg,#2b2440,#1a1f26);border:1px solid #5b4a8a}
.claim{border-color:#f2c230}
.claim p{margin:0 0 10px}
.claim p:last-child{margin:10px 0 0}
.chal small{display:block;color:var(--muted);font-size:12px}
.chal-go{color:#b9a4ff}
.bt-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:4px}
.kidots{display:inline-flex;gap:4px;vertical-align:middle}
.kidots i{width:12px;height:12px;border-radius:50%;border:2px solid #6b5a2a}
.kidots i.on{background:#f2c230;border-color:#f2c230;box-shadow:0 0 6px rgba(242,194,48,.7)}
.bt-log .spx{color:#f2c230;font-weight:700}
.bt-log .warnl{color:var(--warn);font-weight:700}
.bt-acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.bt-acts[hidden]{display:none}
.bt-a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62px;padding:8px 4px;border-radius:12px;background:var(--card2);border:1px solid var(--line);line-height:1.3}
.bt-a b{font-size:15px}
.bt-a small{font-size:10.5px;color:var(--muted)}
.bt-a:active{background:#2d3542}
.bt-a:disabled{opacity:.4}
.bt-a.sp.ready:not(:disabled){background:var(--acc);border-color:var(--acc);color:#1a0d00}
.bt-a.sp.ready:not(:disabled) small{color:#4a2500}
.bt-a.warn:not(:disabled){border-color:var(--warn);box-shadow:0 0 0 2px rgba(245,184,75,.35)}
.battle .row2 .ghost{margin-top:0}
@media (prefers-reduced-motion:reduce){.fx-pop,.hero-svg.idle,.hud-coin.bump b{animation:none}.fx-pop.big{transform:translateX(-50%)}.bt-boss{transition:none}}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
#mic{display:none!important}
</style>
</head>

// ひらがな→カタカナ、全角半角統一、空白・記号除去、小文字化
function norm(s) {
  return String(s).normalize('NFKC').toLowerCase()
    .replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60))

// 単位の直前にある漢数字を算用数字に (二頭・三頭 などは変換しない)
const KD = { '〇': 0, '零': 0, '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
function kanjiInt(s) {
  let total = 0, cur = 0;
  for (const c of s) {
    if (c in KD) cur = KD[c];
    else if (c === '十') { total += (cur || 1) * 10; cur = 0; }
    else if (c === '百') { total += (cur || 1) * 100; cur = 0; }
    else if (c === '千') { total += (cur || 1) * 1000; cur = 0; }
  }
  return total + cur;
}
function convertKanjiNums(t) {
  return t.replace(/([〇零一二三四五六七八九十百千]+)(?:[点.]([〇零一二三四五六七八九]+))?(?=\s*(?:キロ|きろ|kg|回|かい|レップ|れっぷ|セット|せっと))/gi,
    (m, a, b) => kanjiInt(a) + (b ? '.' + [...b].map(c => KD[c]).join('') : ''));
}

function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}

// ---------- 種目 ----------
function allEx() {
  const m = new Map();
  EX_DB.forEach(([n, p, e, a]) => m.set(n, { name: n, part: p, equip: e, aliases: a || [] }));
  S.customEx.filter(x => !x.del).forEach(x => m.set(x.name, { name: x.name, part: x.part, equip: x.equip, aliases: [], custom: true }));
  return [...m.values()];
}
function exInfo(name) { return allEx().find(x => x.name === name) || { name, part: 'その他', equip: 'その他', aliases: [] }; }

function matchEx(q, allowFuzzy = true) {
  if (!q) return null;
  const list = allEx();
  // 1) 発話に種目名(別名)が含まれる → 最長一致
  let best = null, bl = 0;
  for (const x of list) for (const k of [x.name, ...x.aliases]) {
    const nk = norm(k);
    if (nk && q.includes(nk) && nk.length > bl) { best = x; bl = nk.length; }
  }
  if (best) return best;
  // 2) 種目名の一部を言った (3文字以上) → 最短の名前
  if (q.length >= 3) {
    let bs = null, blen = 1e9;
    for (const x of list) for (const k of [x.name, ...x.aliases]) {
      const nk = norm(k);
      if (nk.includes(q) && nk.length < blen) { bs = x; blen = nk.length; }
    }
    if (bs) return bs;
  }
  if (!allowFuzzy) return null;
  // 3) 聞き間違い対策のあいまい一致
  let fb = null, fd = 1e9;
  for (const x of list) for (const k of [x.name, ...x.aliases]) {
    const nk = norm(k); const d = lev(q, nk) / Math.max(nk.length, q.length);
    if (d < fd) { fd = d; fb = x; }
  }
  return fd <= 0.34 ? fb : null;
}

function matchPartEquip(q) {
  let t = q; const parts = new Set(); let equip = null;
  const all = [];
  for (const [p, al] of Object.entries(PART_AL)) al.forEach(a => all.push(['p', p, norm(a)]));
  for (const [e, al] of Object.entries(EQUIP_AL)) al.forEach(a => all.push(['e', e, norm(a)]));
  all.sort((a, b) => b[2].length - a[2].length);
  for (const [k, v, a] of all) {
    if (t.includes(a)) {
      if (k === 'p') { if (v === '腕') { parts.add('二頭'); parts.add('三頭'); parts.add('前腕'); } else parts.add(v); }
      else if (!equip) equip = v;
      t = t.split(a).join(' ');
    }
  }
  if (!parts.size && !equip) return null;
  const left = t.replace(/\s|ノ|ト|ヲ|デ|系|オ|ゴ|種目|シュモク|一覧|イチラン|メニュー|トレーニング|エクササイズ/g, '');
  return { parts: [...parts], equip, left };
}

// ---------- 発話・入力の解釈 ----------
function parseCommand(raw) {
  let t = convertKanjiNums(String(raw).normalize('NFKC'));
  if (/取り?消|とりけ|キャンセル|元に戻|もとにもど|削除|さくじょ|やり直|やりなお/.test(t)) return { type: 'undo' };

  {
    const pn = norm(t).replace(/^(今日ハ|キョウハ|今日|キョウ)/, '');
    if (/^(次|ツギ)(ノ種目|ノシュモク|ヘ|ニ|ニイク|イコウ)?$/.test(pn)) return { type: 'next' };
    if (/^(パターン|メニュー)?(ヲ)?(終了|シュウリョウ|オワリ|終ワリ|オワル|終ワル|終ワリ)$/.test(pn)) return { type: 'end' };
    const ps = (typeof S !== 'undefined' ? S.patterns : []).filter(p => !p.del).sort((a, b) => b.name.length - a.name.length);
    for (const p of ps) {
      const full = norm(p.name), core = full.replace(/(ノ日|ノヒ|デー|day)$/, '');
      if (pn.includes(full)) return { type: 'pattern', p };
      if (core.length >= 1 && pn.startsWith(core) && pn.length > core.length && /^(ノ日|ノヒ)?(ヲ)?(ハジメル|始メル|ハジメ|開始|カイシ|スタート|ヤル|ヤリマス)$/.test(pn.slice(core.length))) return { type: 'pattern', p };
    }
  }
  let w = null, r = null, sets = null;
  t = t.replace(/(\d+(?:\.\d+)?)\s*(?:kg|キログラム|キロ|きろ)/i, (m, a) => { w = parseFloat(a); return ' '; });
  t = t.replace(/(\d+)\s*(?:セット|せっと|sets?)/i, (m, a) => { sets = parseInt(a, 10); return ' '; });
  t = t.replace(/(\d+)\s*(?:回|かい|レップ|れっぷ|reps?)/i, (m, a) => { r = parseInt(a, 10); return ' '; });
  const bare = [];
  t = t.replace(/\d+(?:\.\d+)?/g, m => { bare.push(parseFloat(m)); return ' '; });
  if (w == null && r == null && bare.length >= 2) { w = bare[0]; r = bare[1]; }
  else if (w != null && r == null && bare.length >= 1) r = bare[0];
  else if (w == null && r != null && bare.length >= 1) w = bare[0];
  else if (w == null && r == null && bare.length === 1) r = bare[0];

  let rest = norm(t).replace(/[×x*]/g, '');
  // 前後のつなぎ言葉を除去
  const tail = /(ヲ|デ|ハ|ガ|記録|キロク|ヤッタ|ヤル|シタ|シテ|シマス|オネガイ|オネガイシマス|今日|キョウ|ヲヤル|ヲヤリタイ|ヤリタイ|教エテ|オシエテ|見セテ|ミセテ|一覧|イチラン|種目|シュモク|メニュー|系)$/;
  const head = /^(今日ハ|キョウハ|今日|キョウ|次ハ|ツギハ|次|ツギ)/;
  for (let i = 0; i < 6; i++) { const b = rest; rest = rest.replace(tail, '').replace(head, ''); if (b === rest) break; }

  const full = norm(t).replace(/[×x*]/g, '');
  const hasNum = w != null || r != null;
  if (hasNum) return { type: 'record', ex: (full && matchEx(full, false)) || matchEx(rest), rawName: rest, w, r, sets };
  if (!rest) return { type: 'unknown', rawName: '' };
  const pe = matchPartEquip(rest);
  if (pe && !pe.left) return { type: 'browse', parts: pe.parts, equip: pe.equip };
  const exact = matchEx(full, false) || matchEx(rest, false);
  if (exact) return { type: 'suggest', ex: exact };
  if (pe) return { type: 'browse', parts: pe.parts, equip: pe.equip };
  const fz = matchEx(rest, true);
  if (fz) return { type: 'suggest', ex: fz };
  return { type: 'unknown', rawName: rest };
}

// ---------- 1RM (Epley式) ----------
const r1 = x => Math.round(x * 10) / 10;
function e1rm(w, r) { w = +w; r = +r; if (!(w > 0) || !(r > 0)) return 0; return r === 1 ? w : w * (1 + r / 30); }
function dayOrm(sets) { return sets.reduce((m, s) => Math.max(m, e1rm(s.w, s.r)), 0); }
function ormStats(name, day = today()) {
  const ss = sessions(name); // 新しい順
  const past = ss.filter(x => x.date < day), cur = ss.find(x => x.date === day);
  let best = null;
  for (const x of past) { const o = dayOrm(x.sets); if (o > 0 && (!best || o > best.o)) best = { o, date: x.date }; }
  const last = past.find(x => dayOrm(x.sets) > 0);
  return { best, last: last ? { o: dayOrm(last.sets), date: last.date } : null, today: cur ? dayOrm(cur.sets) : 0 };
}
// 指定重量での最大回数 / 指定回数での最大重量
const repsAt = (w, orm) => (w >= orm ? (w === orm ? 1 : 0) : Math.floor(30 * (orm / w - 1)));
const weightFor = (r, orm) => (r <= 1 ? orm : orm / (1 + r / 30));
// その日の1RMがそれまでの自己ベストを上回ったか
function isPrDay(name, day) {
  const ss = sessions(name); const d = ss.find(x => x.date === day); if (!d) return false;
  const o = dayOrm(d.sets); if (!o) return false;
  const prev = ss.filter(x => x.date < day);
  return prev.length > 0 && prev.every(x => dayOrm(x.sets) < o);
}

// ---------- 提案ロジック (ダブルプログレッション) ----------
function sessions(name) {
  const by = {};
  for (const s of S.sets) { if (s.del || s.ex !== name) continue; (by[s.date] = by[s.date] || []).push(s); }
  return Object.keys(by).sort().reverse().map(d => ({ date: d, sets: by[d].sort((a, b) => a.ts - b.ts) }));
}
function roundTo(x, inc) { return inc > 0 ? num(Math.round(x / inc) * inc) : num(x); }

function suggest(name, day = today()) {
  const ex = exInfo(name);
  const lo = +S.settings.repMin || 8, hi = Math.max(+S.settings.repMax || 12, lo);
  const inc = INC[ex.equip] ?? 2.5;
  const past = sessions(name).filter(x => x.date < day);
  if (!past.length) {
    return { first: true, w: ex.equip === '自重' ? 0 : null, r: hi, sets: 3,
      reason: ex.equip === '自重' ? 'はじめての種目です。できる回数を3セット記録しましょう。'
        : `はじめての種目です。${hi}回がぎりぎりできる重量を探しながら3セット行いましょう。` };
  }
  const last = past[0];
  const top = Math.max(...last.sets.map(s => s.w));
  const work = last.sets.filter(s => (top > 0 ? s.w >= top * 0.9 : true));
  const nSets = work.length >= 2 ? Math.min(work.length, 6) : 3;
  const minTop = Math.min(...last.sets.filter(s => s.w === top).map(s => s.r));
  const minWork = Math.min(...work.map(s => s.r));
  const base = { last, sets: nSets };

  if (top === 0 || inc === 0) {
    const t = minTop + 1;
    return { ...base, w: top, r: t, reason: `前回 ${fmtW(top)}で最少${minTop}回 → 各セット${t}回を目指しましょう` };
  }
  if (minWork >= hi) {
    const nw = roundTo(top + inc, inc);
    return { ...base, w: nw, r: lo, up: true, reason: `前回 ${fmtW(top)}で全セット${hi}回以上 → +${inc}kgして${lo}回から` };
  }
  if (minTop < lo) {
    const prev = past[1];
    let prevFail = false;
    if (prev) {
      const pt = Math.max(...prev.sets.map(s => s.w));
      const pr = Math.min(...prev.sets.filter(s => s.w === pt).map(s => s.r));
      prevFail = pt >= top && pr < lo;
    }
    if (prevFail) {
      const nw = roundTo(top * 0.9, inc);
      return { ...base, w: nw, r: lo, down: true, reason: `2回続けて${lo}回未満 → 約10%下げて${fmtW(nw)}で立て直し` };
    }
    return { ...base, w: top, r: lo, reason: `前回 ${fmtW(top)}で最少${minTop}回 → 同じ重量で${lo}回を目指しましょう` };
  }
  const t = Math.min(minTop + 1, hi);
  return { ...base, w: top, r: t, reason: `前回 ${fmtW(top)}で最少${minTop}回 → 同じ重量で${t}回を目指しましょう` };
}

const livePatterns = () => S.patterns.filter(p => !p.del);
function sessionInfo() {
  if (!S.session || S.session.date !== today()) return null;

  const items = p.items.map(n => { const sg = suggest(n); return { n, done: todaySets(n).length, target: sg.sets, sg }; });
  return { p, items };
}
function nextItem(skip) {
  const si = sessionInfo(); if (!si) return null;
  const i0 = si.items.findIndex(i => i.n === skip);
  const order = i0 < 0 ? si.items : [...si.items.slice(i0 + 1), ...si.items.slice(0, i0 + 1)];
  const it = order.find(i => i.done < i.target && i.n !== skip);
  return it ? it.n : null;
}
function sugText(sg) { return sg.first ? '初回' : sg.w === 0 ? `${sg.r}回×${sg.sets}` : `${fmtW(sg.w)}×${sg.r}×${sg.sets}`; }
function startPattern(id, speak = false) {
  const p = S.patterns.find(x => x.id === id && !x.del); if (!p) return;
  S.session = { pid: p.id, date: today() }; save();
  const first = nextItem(null) || p.items[0];
  if (first) selectEx(first, false); else go('today');
  if (speak) { const sg = first ? suggest(first) : null; say(`${p.name}を始めます。${p.items.length}種目。最初は${first}${sg && !sg.first ? `、${fmtW(sg.w)}で${sg.r}回を${sg.sets}セット` : ''}`); }
}
function endSession() { S.session = null; save(); render(); }

// ---------- 記録操作 ----------
function todaySets(name) { return S.sets.filter(s => !s.del && s.date === today() && (!name || s.ex === name)).sort((a, b) => a.ts - b.ts); }

function addSets(name, w, r, n = 1) {
  const now = Date.now();
  const g0 = typeof gameSnap === 'function' ? gameSnap() : null;
  for (let i = 0; i < n; i++) S.sets.push({ id: uid(), date: today(), ts: now + i, ex: name, w: num(w), r: Math.round(r), u: now });
  cur.ex = name; cur.w = num(w); cur.r = Math.round(r);
  touch();
  const done = todaySets(name).length;
  const sg = suggest(name);
  let msg = `${name} ${fmtW(w)} ${r}回${n > 1 ? `×${n}セット` : ''} を記録。今日${done}セット目`;
  let short = `✓ ${fmtW(w)} × ${r}回${n > 1 ? ` ×${n}` : ''}・${done}/${sg.sets}セット`;
  if (done === sg.sets) {
    msg += `。目標の${sg.sets}セット完了`;
    if (sessionInfo()) {
      const nx = nextItem(name);
      if (nx) { const s2 = suggest(nx); msg += `。次は${nx}${s2.first ? '' : `、${fmtW(s2.w)}で${s2.r}回`}`; short += `　次は${nx}`; selectEx(nx, false); }
      else { msg += '。パターンの全種目が完了しました。お疲れさまでした'; short += '　全種目完了！'; }
    }
  }
  if (g0) { const gd = gameDiffText(g0); if (gd) msg += '。' + gd; }
  const fxOk = g0 && typeof celebrate === 'function';
  say(msg, fxOk ? false : short);
  if (fxOk) celebrate(g0, short);
  primeAudio(); startRest();
}
function deleteSet(id) {
  const s = S.sets.find(x => x.id === id); if (!s) return;
  s.del = true; s.u = Date.now(); touch();
}
function undoLast() {
  const t = todaySets(); const s = t[t.length - 1];
  if (!s) { say('今日の記録はありません'); return; }
  deleteSet(s.id); say(`${s.ex} ${fmtW(s.w)} ${s.r}回 を取り消しました`);
}

function selectEx(name, speak = false) {
  cur.ex = name;
  const sg = suggest(name);
  const t = todaySets(name);
  if (t.length) { const l = t[t.length - 1]; cur.w = l.w; cur.r = l.r; }
  else { cur.w = sg.w ?? ''; cur.r = sg.r ?? ''; }
  go('today');
  if (speak) {
    if (sg.first) say(`${name}は記録がありません。${sg.reason}`);
    else say(`${name}、今日は${fmtW(sg.w)}で${sg.r}回を${sg.sets}セット${t.length ? `。${t.length}セット完了済み` : ''}`);
  }
}

// ---------- コマンド実行 ----------
async function handleCommand(text, alts = []) {
  text = (text || '').trim(); if (!text) return;
  let c = null;
  for (const cand of [text, ...alts]) { const p = parseCommand(cand); if (p.type !== 'unknown') { c = p; break; } if (!c) c = p; }
  switch (c.type) {
    case 'undo': undoLast(); break;
    case 'pattern': startPattern(c.p.id, true); break;
    case 'next': {
      const nx = nextItem(cur.ex);
      if (nx) selectEx(nx, true); else say(sessionInfo() ? 'パターンの種目はすべて完了しています' : 'パターンが始まっていません');
      break;
    }
    case 'end': if (sessionInfo()) { endSession(); say('パターンを終了しました'); } else say('パターンは始まっていません'); break;
    case 'suggest': selectEx(c.ex.name, true); break;
    case 'browse': {
      browse = { parts: c.parts, equip: c.equip }; pick.tab = 'ex'; go('browse');
      const n = filteredEx().length;
      say(`${[c.parts.length ? (c.parts.includes('二頭') && c.parts.includes('三頭') ? '腕' : c.parts.join('・')) : '', c.equip || ''].filter(Boolean).join('・')}の種目は${n}件です`);
      break;
    }
    case 'record': {
      primeAudio();
      let ex = c.ex;
      if (!ex && !c.rawName && cur.ex) ex = exInfo(cur.ex);
      if (!ex && c.rawName) ex = await openAddDialog(c.rawName);
      if (!ex) { if (!c.rawName) say('種目を指定してください'); return; }
      let w = c.w;
      if (w == null) {
        if (ex.equip === '自重') w = 0;
        else if (cur.ex === ex.name && cur.w !== '') w = +cur.w;
        else { say('重量が聞き取れませんでした'); selectEx(ex.name); return; }
      }
      if (c.r == null) { say('回数が聞き取れませんでした'); selectEx(ex.name); cur.w = w; render(); return; }
      addSets(ex.name, w, c.r, Math.min(c.sets || 1, 10));
      break;
    }
    default:
      if (c.rawName) {
        const ex = await openAddDialog(c.rawName);
        if (ex) selectEx(ex.name, true);
      } else say('うまく聞き取れませんでした');
  }
}

// =========================================================
const SCOPE = 'https://www.googleapis.com/auth/drive.file';
const FILE_NAME = 'training-log.json';
let syncing = false, syncTimer = null, gisPromise = null, lastError = '';

function loadGis() {
  if (typeof google !== 'undefined' && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if (gisPromise) return gisPromise;
  gisPromise = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = res; s.onerror = () => { gisPromise = null; rej(new Error('gis')); };
    document.head.appendChild(s);
  });
  return gisPromise;
}
const LOCAL_ONLY = typeof window !== 'undefined' && !!window.LOCAL_ONLY;
const tokenValid = () => S.sync.token && Date.now() < S.sync.tokenExp - 60000;

function requestToken() {
  return new Promise((res, rej) => {
    if (typeof google === 'undefined' || !google.accounts) { rej(new Error('Googleのログイン部品を読み込み中です。もう一度タップしてください')); loadGis().catch(() => {}); return; }
    const tc = google.accounts.oauth2.initTokenClient({
      client_id: S.settings.clientId.trim(), scope: SCOPE,
      callback: r => {
        if (r.error) { rej(new Error(r.error)); return; }
        S.sync.token = r.access_token; S.sync.tokenExp = Date.now() + (r.expires_in || 3600) * 1000;
        S.sync.connected = true; save(); res();
      },
      error_callback: e => rej(new Error(e && e.type ? e.type : 'popup')),
    });
    tc.requestAccessToken({ prompt: S.sync.connected ? '' : 'consent' });
  });
}

async function gfetch(url, opt = {}) {
  const r = await fetch(url, { ...opt, headers: { ...(opt.headers || {}), Authorization: 'Bearer ' + S.sync.token } });
  if (r.status === 401) { S.sync.token = null; save(); throw new Error('auth'); }
  return r;
}

function mergeData(a, b) {
  const m = new Map();
  for (const s of [...(a.sets || []), ...(b.sets || [])]) { const o = m.get(s.id); if (!o || (s.u || 0) > (o.u || 0)) m.set(s.id, s); }
  const c = new Map();
  for (const x of [...(a.customEx || []), ...(b.customEx || [])]) { const o = c.get(x.name); if (!o || (x.u || 0) > (o.u || 0)) c.set(x.name, x); }
  const pm = new Map();
  for (const x of [...(a.patterns || []), ...(b.patterns || [])]) { const o = pm.get(x.id); if (!o || (x.u || 0) > (o.u || 0)) pm.set(x.id, x); }
  const ga = a.game, gb = b.game, game = !gb ? ga : !ga ? gb : (ga.u || 0) >= (gb.u || 0) ? ga : gb;
  return { sets: [...m.values()].sort((x, y) => x.ts - y.ts), customEx: [...c.values()], patterns: [...pm.values()], game };
}

function scheduleSync() { clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(false), 1500); }

async function syncNow(interactive) {
  if (LOCAL_ONLY || syncing) return;
  if (!S.settings.clientId.trim()) { if (interactive) { toast('設定でGoogleのクライアントIDを入力してください'); go('settings'); } return; }
  if (!navigator.onLine) { if (interactive) toast('オフラインです。端末に保存し、通信が戻ったら同期します'); renderBadge(); return; }
  if (!tokenValid()) {
    if (!interactive) { renderBadge(); return; }
    try { await requestToken(); } catch (e) { toast('Googleに接続できませんでした: ' + e.message); return; }
  }
  syncing = true; lastError = ''; renderBadge();
  const seq = S.sync.seq;
  try {
    let id = S.sync.fileId, remote = null;
    const getFile = async fid => {
      const r = await gfetch(`https://www.googleapis.com/drive/v3/files/${fid}?alt=media`);
      if (r.status === 404) return undefined;
      if (!r.ok) throw new Error('読込 ' + r.status);
      return r.json();
    };
    if (id) { remote = await getFile(id); if (remote === undefined) { id = null; remote = null; } }
    if (!id) {
      const q = encodeURIComponent(`name='${FILE_NAME}' and trashed=false`);
      const r = await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id)&orderBy=modifiedTime%20desc`);
      if (!r.ok) throw new Error('検索 ' + r.status);
      const j = await r.json();
      if (j.files && j.files[0]) { id = j.files[0].id; remote = (await getFile(id)) || null; }
    }
    const merged = mergeData({ sets: S.sets, customEx: S.customEx, patterns: S.patterns, game: S.game }, remote || {});
    const body = JSON.stringify({ app: 'training-log', version: 1, savedAt: new Date().toISOString(), ...merged });
    if (id) {
      const r = await gfetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,
        { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body });
      if (!r.ok) throw new Error('保存 ' + r.status);
    } else {
      const b = 'tl' + uid();
      const meta = JSON.stringify({ name: FILE_NAME, mimeType: 'application/json' });
      const mp = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
      const r = await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
        { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body: mp });
      if (!r.ok) throw new Error('作成 ' + r.status);
      id = (await r.json()).id;
    }
    // 同期中に追加された記録も失わないよう再マージ
    const fin = mergeData({ sets: S.sets, customEx: S.customEx, patterns: S.patterns, game: S.game }, merged);
    S.sets = fin.sets; S.customEx = fin.customEx; S.patterns = fin.patterns; if (fin.game) S.game = fin.game;
    S.sync.fileId = id; S.sync.lastSync = Date.now();
    if (S.sync.seq === seq) S.sync.dirty = false;
    save();
    if (interactive) toast('Google Driveに同期しました');
  } catch (e) {
    lastError = e.message === 'auth' ? 'ログインの有効期限切れ（タップで再接続）' : e.message;
    if (interactive) toast('同期に失敗しました: ' + lastError);
  } finally {
    syncing = false; render();
    if (S.sync.dirty && S.sync.seq !== seq) scheduleSync();
  }
}

const SR = typeof window !== 'undefined' ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;
let rec = null, listening = false;
const PH = '種目名で探す・「ベンチ 60キロ 10回」';

function toggleMic() {
  if (!SR) { toast('このブラウザは音声入力に対応していません（Chromeを使ってください）'); return; }
  if (listening && rec) { rec.stop(); return; }
  try { speechSynthesis.cancel(); } catch (e) { /* noop */ }
  rec = new SR(); rec.lang = 'ja-JP'; rec.interimResults = true; rec.maxAlternatives = 3; rec.continuous = false;
  const inp = $('#cmd'), mic = $('#mic');
  rec.onstart = () => { listening = true; mic.classList.add('on'); inp.placeholder = '聞き取り中…'; };
  rec.onresult = e => {
    let txt = '', fin = false;
    for (let i = e.resultIndex; i < e.results.length; i++) { txt += e.results[i][0].transcript; if (e.results[i].isFinal) fin = true; }
    inp.value = txt;
    if (fin) {
      const last = e.results[e.results.length - 1];
      const alts = []; for (let i = 1; i < last.length; i++) alts.push(last[i].transcript);
      handleCommand(txt, alts); inp.value = '';
    }
  };
  rec.onerror = e => {
    if (e.error === 'network') toast('音声認識には通信が必要です。オフライン時は文字で入力してください');
    else if (e.error === 'not-allowed') toast('マイクの使用を許可してください');
    else if (e.error !== 'no-speech' && e.error !== 'aborted') toast('音声認識エラー: ' + e.error);
  };
  rec.onend = () => { listening = false; mic.classList.remove('on'); inp.placeholder = PH; };
  try { rec.start(); } catch (e) { toast('音声入力を開始できませんでした'); }
}

    u.lang = 'ja-JP'; u.rate = 1.1; speechSynthesis.speak(u);

// ---------- 休憩タイマー（記録すると自動で始まる） ----------
let rest = null, restTick = null, actx = null;
function primeAudio() { try { const A = window.AudioContext || window.webkitAudioContext; if (!A) return; actx = actx || new A(); if (actx.state === 'suspended') actx.resume(); } catch (e) { /* 音なしで続行 */ } }

  try {
    if (!actx) return;
    [0, 0.22].forEach(d => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + d); o.stop(actx.currentTime + d + 0.14); });
  } catch (e) { /* noop */ }
}
function startRest(sec) {
  if (typeof document === 'undefined') return;
  sec = sec == null ? +S.settings.rest : sec;
  if (!(sec > 0)) return;
  rest = { end: Date.now() + sec * 1000, total: sec, done: false };
  clearInterval(restTick); restTick = setInterval(renderRest, 250); renderRest();
}

function renderRest() {
  const el = $('#rest'); if (!el) return;
  document.body.classList.toggle('resting', !!rest);
  if (!rest) { el.hidden = true; return; }
  const ms = rest.end - Date.now(), left = Math.ceil(ms / 1000);
  if (left <= 0 && !rest.done) { rest.done = true; rest.doneAt = Date.now(); beep(); try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { /* noop */ } }
  if (rest.done && Date.now() - rest.doneAt > 6000) return stopRest();
  el.hidden = false; el.classList.toggle('done', rest.done);
  $('#rest-t').textContent = rest.done ? '休憩おわり！次のセットへ' : `休憩 ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  $('#rest-bar').style.width = (rest.done ? 100 : Math.max(0, ms / (rest.total * 1000)) * 100) + '%';
}

function filteredEx() {

function lastOf(name) { const s = sessions(name); return s[0] || null; }

function ormHtml(name) {

// ---------- 俯瞰（週・月・四半期・年） ----------
const UNITS = [['day', '日別'], ['week', '週'], ['month', '月'], ['quarter', '四半期'], ['year', '年']];
const UNIT_N = { week: 12, month: 12, quarter: 8, year: 5 };
const pd = d => new Date(d + 'T00:00:00');
function startOf(dateStr, unit) {
  const d = pd(dateStr);

  else if (unit === 'month') d.setDate(1);
  else if (unit === 'quarter') { d.setMonth(Math.floor(d.getMonth() / 3) * 3, 1); }
  else if (unit === 'year') d.setMonth(0, 1);

}
function addUnit(key, unit, n) {

}

  if (unit === 'month') return short ? `${m}月` : `${y}年${m}月`;
  if (unit === 'quarter') return short ? `${String(y).slice(2)}Q${Math.floor((m - 1) / 3) + 1}` : `${y}年 Q${Math.floor((m - 1) / 3) + 1}（${m}〜${m + 2}月）`;

}
function inBucket(s, key, unit) { return s.date >= key && s.date < addUnit(key, unit, 1); }
function bucketStats(key, unit, cutoff) {
  const ss = S.sets.filter(s => !s.del && inBucket(s, key, unit) && (!cutoff || s.date < cutoff));
  const days = new Set(ss.map(s => s.date));

  ss.forEach(s => { const e = byEx[s.ex] = byEx[s.ex] || { sets: 0, vol: 0, orm: 0, reps: 0 }; e.sets++; e.vol += s.w * s.r; e.reps += s.r; e.orm = Math.max(e.orm, e1rm(s.w, s.r)); });

}
const fmtVol = v => (v >= 10000 ? r1(v / 1000) + 't' : Math.round(v).toLocaleString() + 'kg');

}

// 棒グラフ（直近の期間ごとの総負荷）
function volChart(keys, unit, sel) {
  const vals = keys.map(k => bucketStats(k, unit).vol);
  const max = Math.max(...vals, 1), W = 340, H = 150, top = 18, bot = 22, n = keys.length;
  const bw = Math.min(28, (W - 8) / n - 4), gap = (W - bw * n) / (n + 1);
  let g = `<line x1="0" y1="${H - bot}" x2="${W}" y2="${H - bot}" class="ax"/>`;
  keys.forEach((k, i) => {
    const x = gap + i * (bw + gap), h = vals[i] ? Math.max(3, (vals[i] / max) * (H - top - bot)) : 0, y = H - bot - h;
    const on = k === sel;
    g += `<g class="hb" data-hb="${k}"><rect x="${x - gap / 2}" y="0" width="${bw + gap}" height="${H}" fill="transparent"/>`;
    if (h) g += `<path d="M${x},${H - bot} V${y + 4} Q${x},${y} ${x + 4},${y} H${x + bw - 4} Q${x + bw},${y} ${x + bw},${y + 4} V${H - bot} Z" class="${on ? 'bar on' : 'bar'}"><title>${unitLabel(k, unit)}：${fmtVol(vals[i])}</title></path>`;
    if (on && vals[i]) g += `<text x="${x + bw / 2}" y="${y - 5}" class="vl">${fmtVol(vals[i])}</text>`;
    if (n <= 8 || i % 2 === (n - 1) % 2 || on) g += `<text x="${x + bw / 2}" y="${H - 6}" class="xl ${on ? 'on' : ''}">${unitLabel(k, unit, true)}</text>`;
    g += '</g>';

}
// 折れ線（種目の期間ベスト推定1RM）
function ormChart(keys, unit, ex, sel) {
  const pts = keys.map(k => { const ss = S.sets.filter(s => !s.del && s.ex === ex && inBucket(s, k, unit)); return ss.length ? dayOrm(ss) : null; });
  const have = pts.filter(v => v);
  if (!have.length) return '<p class="muted small">この期間の記録がありません</p>';
  let lo = Math.min(...have), hi = Math.max(...have); const pad = Math.max((hi - lo) * 0.15, 2); lo = Math.max(0, lo - pad); hi += pad;
  const W = 340, H = 150, top = 16, bot = 22, L = 6, R = 6, n = keys.length;
  const X = i => L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1)), Y = v => top + (1 - (v - lo) / (hi - lo)) * (H - top - bot);
  let path = '', g = `<line x1="0" y1="${H - bot}" x2="${W}" y2="${H - bot}" class="ax"/>`;
  pts.forEach((v, i) => { if (v) path += (path ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1); });
  g += `<path d="${path}" class="ln"/>`;
  const lastI = pts.map((v, i) => (v ? i : -1)).filter(i => i >= 0).pop();
  const bestV = Math.max(...have);
  pts.forEach((v, i) => {
    const on = keys[i] === sel;
    g += `<g class="hb" data-hb="${keys[i]}"><rect x="${X(i) - 14}" y="0" width="28" height="${H}" fill="transparent"/>`;
    if (v) {

      if (on || i === lastI || v === bestV) g += `<text x="${Math.min(Math.max(X(i), 20), W - 20)}" y="${Y(v) - 9}" class="vl">${r1(v)}</text>`;
    }
    if (n <= 8 || i % 2 === (n - 1) % 2 || on) g += `<text x="${Math.min(Math.max(X(i), 12), W - 12)}" y="${H - 6}" class="xl ${on ? 'on' : ''}">${unitLabel(keys[i], unit, true)}</text>`;
    g += '</g>';

}
function calHtml(key, unit) {

    const ss = S.sets.filter(s => !s.del && s.ex === name && inBucket(s, k, u));
    if (!ss.length) return null;
    if (trend.metric === 'orm') return r1(dayOrm(ss)) || null;
    if (trend.metric === 'maxw') return Math.max(...ss.map(s => s.w)) || null;
    if (trend.metric === 'reps') return Math.max(...ss.map(s => s.r));
    return bw ? ss.reduce((a, s) => a + s.r, 0) : ss.reduce((a, s) => a + s.w * s.r, 0);
  });
  const [label, us] = trend.metric === 'vol' && bw ? ['総回数', '回'] : METRICS[trend.metric];
  const fmt = trend.metric === 'vol' && !bw ? fmtVol : v => r1(v) + us;
  const have = vals.filter(v => v != null);
  const first = have[0], lastV = have[have.length - 1];
  const chg = have.length >= 2 && first ? Math.round((lastV / first - 1) * 100) : null;
  return `${head}<div class="trend">
    <div class="seg sm">${[['week', '週'], ['month', '月'], ['quarter', '四半期'], ['year', '年']].map(([k, l]) => `<button class="${u === k ? 'on' : ''}" data-tunit="${k}">${l}</button>`).join('')}</div>
    <div class="chips">${avail.map(m => `<button class="chip ${trend.metric === m ? 'on' : ''}" data-tmetric="${m}">${m === 'vol' && bw ? '総回数' : METRICS[m][0]}</button>`).join('')}</div>
    ${trend.metric === 'vol' ? barChart(keys, u, vals, fmt, label) : lineChart(keys, u, vals, fmt, label)}
    ${have.length ? `<p class="muted small">直近${N}${{ week: '週', month: 'か月', quarter: '四半期', year: '年' }[u]}の${label}（各期間の${trend.metric === 'vol' ? '合計' : '最高'}）${chg != null ? `：最初の期間から <b class="${chg >= 0 ? 'upc' : 'dnc'}">${chg >= 0 ? '+' : ''}${chg}%</b>` : ''}</p>` : ''}
  </div>`;
}

function renderOverview(el) {
  const u = hist.unit;
  if (!hist.anchor || startOf(hist.anchor, u) !== hist.anchor) hist.anchor = startOf(hist.anchor || today(), u);
  const key = hist.anchor, prevKey = addUnit(key, u, -1);
  const N = UNIT_N[u];
  // 選択期間を右端寄りに、直近N期間を表示
  let right = key; const curNow = startOf(today(), u);
  for (let i = 0; i < Math.floor(N / 3) && right < curNow; i++) right = addUnit(right, u, 1);
  const keys = Array.from({ length: N }, (_, i) => addUnit(right, u, i - N + 1));
  const st = bucketStats(key, u), pv = bucketStats(prevKey, u);
  const unitWord = { week: '先週', month: '前月', quarter: '前四半期', year: '前年' }[u];
  let h = `<div class="pnav"><button class="x" data-hnav="-1" aria-label="前の期間">‹</button><b>${unitLabel(key, u)}</b><button class="x" data-hnav="1" aria-label="次の期間" ${key >= curNow ? 'disabled' : ''}>›</button></div>

  h += `<div class="kpis">

    <p class="muted small cmp">▲▼は${unitWord}（期間全体）との比較</p>`;
  h += `<section class="card"><h3>総負荷の推移</h3>${volChart(keys, u, key)}<p class="muted small">棒をタップするとその期間を表示</p></section>`;
  h += calHtml(key, u) ? `<section class="card"><h3>トレーニングした日</h3>${calHtml(key, u)}</section>` : '';
  const parts = Object.entries(st.byPart).sort((a, b) => b[1] - a[1]);
  if (parts.length) {
    const mx = parts[0][1];
    h += `<section class="card"><h3>部位別セット数</h3>${parts.map(([p, n]) => `<div class="pbar"><span>${esc(p)}</span><div><i style="width:${(n / mx) * 100}%"></i></div><b>${n}</b><small>${deltaHtml(n, pv.byPart[p] || 0, '') || (pv.byPart[p] ? '' : '<span class="dlt up">新</span>')}</small></div>`).join('')}</section>`;
  }
  const exs = Object.entries(st.byEx).sort((a, b) => b[1].sets - a[1].sets);
  if (exs.length) {
    h += `<section class="card"><h3>種目別 <small class="muted">1RMは期間内の最高（推定）</small></h3><div class="extab">${exs.map(([n, e]) => {
      const p = pv.byEx[n]; const pr = e.orm && S.sets.every(s => s.del || s.ex !== n || s.date >= key || e1rm(s.w, s.r) < e.orm) && S.sets.some(s => !s.del && s.ex === n && s.date < key);
      return `<button class="exrow ${hist.ex === n ? 'on' : ''}" data-hex="${esc(n)}"><span class="nm">${esc(n)}</span><span>${e.sets}セット・${fmtVol(e.vol)}</span><span class="o">${e.orm ? `1RM ${r1(e.orm)}kg ${p && p.orm ? deltaHtml(e.orm, p.orm, 'kg') : ''}${pr ? ' <span class="dlt up">★</span>' : ''}` : `${e.reps}回`}</span>${p ? `<span class="pv">${unitWord}：${p.sets}セット・${fmtVol(p.vol)}${p.orm ? `・1RM ${r1(p.orm)}kg` : `・${p.reps}回`}</span>` : `<span class="pv">${unitWord}：なし</span>`}</button>`;
    }).join('')}</div></section>`;
  } else h += '<p class="muted pad">この期間の記録はありません</p>';
  // 1RM推移
  const withOrm = [...new Set(S.sets.filter(s => !s.del && s.w > 0).map(s => s.ex))];
  if (withOrm.length) {
    if (!hist.ex || !withOrm.includes(hist.ex)) hist.ex = (exs.find(([n, e]) => e.orm) || [withOrm[0]])[0];

  el.innerHTML = h;
}

function renderHistory() {

  const months = [...new Set(Object.keys(by).map(d => d.slice(0, 7)))].sort().reverse();
  const dm = hist.dayMonth && months.includes(hist.dayMonth) ? hist.dayMonth : '';
  const days = Object.keys(by).filter(d => !dm || d.startsWith(dm)).sort().reverse().slice(0, dm ? 31 : 60);
  const mjump = months.length ? `<div class="jump"><select id="hj-dm" aria-label="表示する月">${opt('', '最近の記録', dm)}${months.map(m => opt(m, `${m.slice(0, 4)}年${+m.slice(5)}月`, dm)).join('')}</select></div>` : '';

    }).join('')}</section>`;
  }).join('');
}

function dialog(html, onOpen) {

    const close = v => { m.hidden = true; m.innerHTML = ''; res(v); };

  });
}
function confirmDialog(msg, ok = '削除') {

function openAddDialog(name = '') {

const PLATES = [25, 20, 15, 10, 5, 2.5, 1.25];
const PLATE_STYLE = { 25: ['#d23a3a', 100], 20: ['#2f6fd6', 92], 15: ['#e2b100', 84], 10: ['#2f9e55', 74], 5: ['#e8e8e8', 56], 2.5: ['#9a9a9a', 46], 1.25: ['#c9c9c9', 38] };
const BARS = [20, 15, 10, 7, 0];
function platesFor(w, bar) {
  let side = num((w - bar) / 2); const out = [];
  if (side <= 0) return out;
  for (const p of PLATES) while (side >= p - 1e-9) { out.push(p); side = num(side - p); }
  return out;
}
function plateDialog(curW, equip) {
  let mode = ['バーベル', 'スミス'].includes(equip) ? 'plate' : 'step';
  let bar = S.settings.bar ?? 20;
  let total = +curW || 0;
  let plates = platesFor(total || bar, bar);
  return dialog('<div id="pd"></div>', (m, close) => {
    const box = m.querySelector('#pd');
    const draw = () => {
      if (mode === 'plate') total = num(bar + 2 * plates.reduce((a, b) => a + b, 0));
      const sorted = [...plates].sort((a, b) => b - a);
      box.innerHTML = `
        <div class="chips pd-tabs"><button class="chip ${mode === 'plate' ? 'on' : ''}" data-mode="plate">バー＋プレート</button><button class="chip ${mode === 'step' ? 'on' : ''}" data-mode="step">増減ボタン</button></div>
        <div class="pd-total">${num(total)}<small>kg</small>${mode === 'plate' && plates.length ? `<span>片側 ${num(plates.reduce((a, b) => a + b, 0))}kg</span>` : ''}</div>
        ${mode === 'plate' ? `
          <div class="barvis"><div class="sleeve"></div>${sorted.map(p => `<i style="background:${PLATE_STYLE[p][0]};height:${PLATE_STYLE[p][1]}%"></i>`).join('')}<div class="cap"></div></div>
          <div class="lbl">バーの重さ</div><div class="chips">${BARS.map(b => `<button class="chip ${b === bar ? 'on' : ''}" data-pbar="${b}">${b ? b + 'kg' : 'なし'}</button>`).join('')}</div>
          <div class="lbl">プレートを追加（両側に1枚ずつ）</div>
          <div class="plates">${PLATES.map(p => `<button class="plate" data-pl="${p}" style="background:${PLATE_STYLE[p][0]};color:${p === 5 || p === 1.25 ? '#111' : '#fff'}">${p}</button>`).join('')}</div>
          <div class="lbl">付けているプレート（タップで外す）</div>
          <div class="chips">${sorted.length ? sorted.map(p => `<button class="chip" data-rm="${p}">${p}kg ✕</button>`).join('') : '<span class="muted small">なし</span>'}</div>`
        : `<div class="steps">${[-10, -5, -2.5, -1, -0.5, 0.5, 1, 2.5, 5, 10].map(v => `<button class="chip" data-step="${v}">${v > 0 ? '+' : '−'}${Math.abs(v)}</button>`).join('')}</div>
          <label class="field">直接入力(kg)<input id="pd-in" type="number" inputmode="decimal" step="any" value="${num(total)}"></label>`}
        <div class="row2"><button class="ghost" data-c="clear">クリア</button><button class="primary" data-c="ok">決定</button></div>`;
      const inp = box.querySelector('#pd-in'); if (inp) inp.oninput = () => { total = Math.max(0, +inp.value || 0); box.querySelector('.pd-total').firstChild.textContent = num(total); };
    };
    box.onclick = e => {
      const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
      if (d.mode) { if (d.mode === 'plate') plates = platesFor(total || bar, bar); mode = d.mode; }
      else if (d.pbar != null) { bar = +d.pbar; S.settings.bar = bar; save(); }
      else if (d.pl) plates.push(+d.pl);
      else if (d.rm) { const i = plates.indexOf(+d.rm); if (i >= 0) plates.splice(i, 1); }
      else if (d.step) total = Math.max(0, num(total + +d.step));
      else if (d.c === 'clear') { plates = []; total = mode === 'plate' ? bar : 0; }
      else if (d.c === 'ok') return close(total);
      draw();
    };
    draw();
  });
}

function editSet(id) {

  const names = allEx().map(x => x.name); if (!names.includes(s.ex)) names.unshift(s.ex);

  (m, close) => {

        if (!(w >= 0) || m.querySelector('#ed-w').value === '') return toast('重量を入力してください');
        if (!(r >= 1)) return toast('回数を入力してください');
        if (d && d !== s.date) { const t = new Date(s.ts); const nd = new Date(d + 'T00:00:00'); nd.setHours(t.getHours(), t.getMinutes(), t.getSeconds()); s.ts = nd.getTime(); s.date = d; }
        s.w = num(w); s.r = Math.round(r); s.ex = ex; s.u = Date.now();

}
// プレート選択から戻ったとき、入力途中の内容を保ったまま修正画面を開き直す
function editDraft(orig, draft) {
  const backup = { ex: orig.ex, w: orig.w, r: orig.r, date: orig.date };
  Object.assign(orig, { ex: draft.ex, w: draft.w, r: draft.r, date: draft.date });
  const p = editSet(orig.id);
  Object.assign(orig, backup); // 保存されるまで元の値のまま
  return p;
}

function editPattern(id, preset) {
  const src = id ? S.patterns.find(p => p.id === id) : null;
  const p = src ? { ...src, items: [...src.items] } : { id: uid(), name: preset?.name || '', items: preset?.items ? [...preset.items] : [] };
  let delArm = false, adding = !p.items.length;
  const ap = { tab: recentExNames(1).length ? 'recent' : 'ex', parts: [], equip: null };
  // 通常の種目選択と同じ見た目の追加パネル（最近／種目、部位・器具で絞り込み）
  const addPanel = () => {
    const seg = `<div class="seg">${[['recent', '最近'], ['ex', '種目']].map(([k, l]) => `<button class="${ap.tab === k ? 'on' : ''}" data-pt="${k}">${l}</button>`).join('')}</div>`;
    const row = x => { const on = p.items.includes(x.name), l = lastOf(x.name);
      return `<li><button data-pa="${esc(x.name)}" class="${on ? 'added' : ''}"><span class="nm">${esc(x.name)}<em>${on ? '✓ 追加済み' : '＋'}</em></span><span class="meta">${esc(x.part)}・${esc(x.equip)}${l ? `｜前回 ${fmtDate(l.date)} ${esc(setsLine(l.sets.slice(0, 1)))}` : ''}</span></button></li>`; };
    let body;
    if (ap.tab === 'recent') {
      const rec = recentExNames(12);
      body = rec.length ? `<ul class="exlist">${rec.map(n => row(exInfo(n))).join('')}</ul>` : '<p class="muted pad">まだ記録がありません。「種目」タブから選んでください。</p>';
    } else {
      const list = allEx().filter(x => (!ap.parts.length || ap.parts.includes(x.part)) && (!ap.equip || x.equip === ap.equip));
      const pb = ['すべて', ...PARTS.filter(q => q !== 'その他' || allEx().some(x => x.part === 'その他'))].map(q => `<button class="chip ${q === 'すべて' ? (!ap.parts.length ? 'on' : '') : ap.parts[0] === q ? 'on' : ''}" data-pp="${q}">${q}</button>`).join('');
      const eb = ['すべて', ...EQUIPS.filter(q => q !== 'その他' || allEx().some(x => x.equip === 'その他'))].map(q => `<button class="chip ${q === 'すべて' ? (!ap.equip ? 'on' : '') : ap.equip === q ? 'on' : ''}" data-pq="${q}">${q}</button>`).join('');
      body = `<div class="lbl">部位</div><div class="chips">${pb}</div><div class="lbl">器具</div><div class="chips">${eb}</div>
        <h3 class="sec">${list.length}件</h3><ul class="exlist">${list.map(row).join('') || '<li class="muted pad">該当する種目がありません</li>'}</ul>`;
    }
    return `<div class="pe-add"><div class="ex-head"><b>種目を追加</b><button class="chip" data-pdone="1">完了</button></div><p class="muted small">タップで追加、もう一度タップで外します。</p>${seg}${body}</div>`;
  };
  return dialog('<div id="pe"></div>', (m, close) => {
    const box = m.querySelector('#pe'), sheet = m.querySelector('.sheet');
    const draw = () => {
      const top = sheet.scrollTop;
      box.innerHTML = `<h3>${src ? 'パターンを編集' : '新しいパターン'}</h3>
        <label class="field">名前（声で呼ぶ名前）<input id="pe-n" value="${esc(p.name)}" placeholder="例: 脚の日"></label>
        <div class="lbl">種目（上から順に行います）</div>
        <ol class="pe-list">${p.items.map((n, i) => `<li><span>${esc(n)}</span><button class="x" data-up="${i}" ${i ? '' : 'disabled'} aria-label="上へ">↑</button><button class="x" data-dn="${i}" ${i < p.items.length - 1 ? '' : 'disabled'} aria-label="下へ">↓</button><button class="x" data-rmi="${i}" aria-label="外す">✕</button></li>`).join('') || '<li class="muted small">まだ種目がありません</li>'}</ol>
        ${adding ? addPanel() : '<button class="ghost" data-padd="1">＋ 種目を追加</button>'}
        <div class="row2">${src ? `<button class="ghost danger-t" data-c="del">${delArm ? '本当に削除' : '削除'}</button>` : '<button class="ghost" data-c="cancel">キャンセル</button>'}<button class="primary" data-c="save">保存</button></div>
        ${src ? '<button class="ghost" data-c="cancel">キャンセル</button>' : ''}`;
      box.querySelector('#pe-n').oninput = e => (p.name = e.target.value);
      sheet.scrollTop = top;
    };
    box.onclick = e => {
      const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
      if (d.padd) adding = true;
      else if (d.pdone) adding = false;
      else if (d.pt) ap.tab = d.pt;
      else if (d.pp) ap.parts = d.pp === 'すべて' ? [] : [d.pp];
      else if (d.pq) ap.equip = d.pq === 'すべて' ? null : d.pq;
      else if (d.pa) { const i = p.items.indexOf(d.pa); if (i >= 0) p.items.splice(i, 1); else p.items.push(d.pa); }
      else if (d.up) { const i = +d.up; [p.items[i - 1], p.items[i]] = [p.items[i], p.items[i - 1]]; }
      else if (d.dn) { const i = +d.dn; [p.items[i + 1], p.items[i]] = [p.items[i], p.items[i + 1]]; }
      else if (d.rmi) p.items.splice(+d.rmi, 1);
      else if (d.c === 'cancel') return close(null);
      else if (d.c === 'del') {
        if (!delArm) { delArm = true; }
        else { src.del = true; src.u = Date.now(); if (S.session && S.session.pid === src.id) S.session = null; touch(); toast(`「${src.name}」を削除しました`); return close(null); }
      } else if (d.c === 'save') {
        p.name = p.name.trim();
        if (!p.name) return toast('名前を入れてください');
        if (!p.items.length) return toast('種目を1つ以上追加してください');
        if (livePatterns().some(x => x.id !== p.id && x.name === p.name)) return toast('同じ名前のパターンがあります');
        p.u = Date.now(); delete p.del;
        S.patterns = S.patterns.filter(x => x.id !== p.id); S.patterns.push(p); touch();
        toast(`「${p.name}」を保存しました`); return close(p);
      }
      draw();
    };
    draw();
  });
}

function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportCsv() {
  const rows = [['日付', '時刻', '種目', '部位', '器具', '重量kg', '回数']];
  S.sets.filter(s => !s.del).sort((a, b) => a.ts - b.ts).forEach(s => {
    const x = exInfo(s.ex); rows.push([s.date, new Date(s.ts).toTimeString().slice(0, 5), s.ex, x.part, x.equip, s.w, s.r]);
  });
  download(`training-log-${today()}.csv`, '﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n'), 'text/csv');
}

function updTrend() { const b = document.querySelector('.trendbox'); if (b && cur.ex) b.innerHTML = trendHtml(cur.ex); }

    if (d.askdel) { const s = S.sets.find(x => x.id === d.askdel); if (s && await confirmDialog(`${s.date} ${s.ex} ${fmtW(s.w)} × ${s.r}回 を削除しますか？`)) deleteSet(s.id); return; }

    if (d.equip) { browse.equip = d.equip === 'すべて' ? null : d.equip; return render(); }

      }
      case 'plates': {

      }
      case 'trend-tg': trend.open = !trend.open; return updTrend();
      case 'hj-now': hist.anchor = today(); return render();
      case 'end-sess': return endSession();
      case 'next': { const nx = nextItem(cur.ex); if (nx) selectEx(nx, false); return; }
      case 'pat-new': return editPattern(null);
      case 'pat-today': { const order = []; todaySets().forEach(s => { if (!order.includes(s.ex)) order.push(s.ex); }); return editPattern(null, { name: '', items: order }); }
      case 'add-ex': { const x = await openAddDialog(''); if (x) selectEx(x.name); return; }
      case 'copy-out': return copyOut();

      case 'claim-past': return claimPast();
      case 'to-boss': gtab = 'boss'; return go('game');
      case 'rest+': if (rest) { rest.end = Math.max(rest.end, Date.now()) + 30000; rest.total += 30; rest.done = false; renderRest(); } return;
      case 'rest-x': return stopRest();
      case 'sync': return syncNow(true);
      case 'seed': return seedSample();
      case 'wipe': if (await confirmDialog('すべての記録を消しますか？')) { S.sets = []; S.customEx = []; cur.ex = null; touch(); toast('消しました'); } return;
      case 'csv': return exportCsv();
      case 'json': return download(`training-log-${today()}.json`, JSON.stringify({ app: 'training-log', version: 1, sets: S.sets, customEx: S.customEx, patterns: S.patterns, game: S.game }, null, 1), 'application/json');
    }
  });
  document.addEventListener('input', e => {
    const id = e.target.id;
    if (id === 'in-w') cur.w = e.target.value;
    if (id === 'in-r') cur.r = e.target.value;
    if (id === 'in-w' || id === 'in-r') updOrm();
  });
  document.addEventListener('change', async e => {
    const id = e.target.id;
    if (id === 'cid') { S.settings.clientId = e.target.value.trim(); S.sync.connected = false; S.sync.token = null; save(); if (S.settings.clientId) loadGis().catch(() => {}); renderBadge(); }
    if (id === 'rmin' || id === 'rmax') { const v = parseInt(e.target.value, 10); if (v > 0) { S.settings[id === 'rmin' ? 'repMin' : 'repMax'] = v; save(); } }
    if (id && id.startsWith('hj-')) {

      else if (id === 'hj-w') { if (v) hist.anchor = startOf(v, 'week'); }
      else {

        let mo = 1;
        if (u === 'quarter') mo = (+$('#hj-q').value - 1) * 3 + 1;

        hist.anchor = `${y}-${String(mo).padStart(2, '0')}-01`;

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { syncNow(false); render(); renderRest(); } });
  setInterval(() => { if (S.sync.dirty) syncNow(false); }, 5 * 60 * 1000);
}

function seedSample() {
  // 約1年分：週3回（胸・背中・脚をローテーション）で少しずつ重量が伸びる記録
  const plan = {
    A: [['ベンチプレス', 50, 0.12], ['インクラインダンベルプレス', 16, 0.025], ['サイドレイズ', 6, 0.01], ['プレスダウン', 20, 0.03]],
    B: [['ラットプルダウン', 40, 0.08], ['ベントオーバーロウ', 40, 0.08], ['ダンベルカール', 8, 0.015], ['懸垂', 0, 0]],
    C: [['スクワット', 60, 0.15], ['ルーマニアンデッドリフト', 50, 0.12], ['レッグカール', 30, 0.05], ['クランチ', 0, 0]],
  };
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  let n = 0, cyc = 0;
  for (let ago = 365; ago >= 1; ago--) {
    const d = new Date(); d.setDate(d.getDate() - ago);
    const wd = d.getDay(); if (![1, 3, 5].includes(wd) || Math.random() < 0.12) continue;
    const day = ymd(d), t0 = d.setHours(19, 0, 0, 0), elapsed = 365 - ago;
    const menu = plan['ABC'[cyc++ % 3]];
    menu.forEach(([ex, base, rate], ei) => {
      const inc = INC[exInfo(ex).equip] || 1;
      const w = base ? roundTo(base + rate * elapsed, inc) : 0;
      for (let k = 0; k < 3; k++) {
        const r = base ? rnd(8, 12) - k : rnd(8, 15) + Math.floor(elapsed / 60) - k;
        S.sets.push({ id: uid(), date: day, ts: t0 + (n++) * 90000, ex, w, r: Math.max(1, r), u: Date.now() });
      }
    });
  }
  touch(); toast('サンプル記録（約1年分）を入れました'); go('today');
}

function init() {
  $('#cmd').placeholder = PH;
  if (LOCAL_ONLY) document.body.classList.add('local');
  bind(); render();
  if (LOCAL_ONLY) { S.settings.speak = false; render(); return; }

  syncNow(false);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
}

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
if (typeof module !== 'undefined') module.exports = { parseCommand, suggest, matchEx, matchPartEquip, mergeData, convertKanjiNums, _S: () => S, _setS: v => { S = v; } };

const liveSets = () => { const t = (S.game && S.game.since) || 0; return S.sets.filter(s => !s.del && s.ts >= t); };

// 旧ルール（総負荷ベース）での獲得量。ルール変更で手持ちが減らないよう、差分の引き継ぎにだけ使う
function oldCalc() {
  let xp = 0, vol = 0, reps = 0, coins = 0;
  const live = liveSets().sort((a, b) => a.ts - b.ts), byEx = {};
  live.forEach(s => {
    xp += s.w > 0 ? 10 + Math.min(40, (s.w * s.r) / 50) : 10 + Math.min(20, s.r);
    if (s.w > 0) { const b0 = Math.floor(vol / 1000); vol += s.w * s.r; coins += 10 * (Math.floor(vol / 1000) - b0); }
    else { const b0 = Math.floor(reps / 100); reps += s.r; coins += 5 * (Math.floor(reps / 100) - b0); }
    const e = byEx[s.ex] = byEx[s.ex] || {}; (e[s.date] = e[s.date] || []).push(s);
  });
  for (const ex in byEx) {
    let best = 0;
    Object.keys(byEx[ex]).sort().forEach(d => { const o = dayOrm(byEx[ex][d]); if (!o) return; if (best > 0 && o > best + 0.05) coins += 20; best = Math.max(best, o); });
  }
  return { xp, coins };
}

function gstate() {
  // 同じオブジェクトを使い続ける（作り直すと戦闘中の変更が失われるため）
  if (!S.game) S.game = {};
  const d = { owned: [], equip: {}, spent: 0, bonus: 0, beaten: 0, bossDmg: 0, lastFight: '', since: 0, u: 0, xpAdj: 0 };
  for (const k in d) if (S.game[k] == null) S.game[k] = d[k];
  if (S.game.cv !== 2) {
    S.game.cv = 2;
    const o = oldCalc(), n = scoreAll();
    S.game.bonus += Math.max(0, o.coins - n.earned);
    S.game.xpAdj = Math.max(0, Math.round(o.xp - n.xp));
  }
  return S.game;
}

// ---------- 記録からの計算 ----------
// セットの「効きポイント」：その種目の自己ベスト（推定1RM／自重は回数）に対する割合で 0.5〜1.5
// 重さの絶対値ではなく「自分の限界にどれだけ近いか」で決まるので、自重でもバーベルでも公平
const COIN = { set: 3, day: 10, pr: 20, week: 50 };
let _sc = null;
function scoreAll(sinceArg) {
  const since = sinceArg != null ? sinceArg : (S.game && S.game.since) || 0, goal = Math.max(1, +S.settings.weekGoal || 3);
  const key = [S.sync.seq, since, S.sets.length, goal].join('|');
  if (_sc && _sc.key === key) return _sc;
  const all = S.sets.filter(s => !s.del).sort((a, b) => a.ts - b.ts);
  const byEx = {}, q = new Map(), prs = [];
  all.forEach(s => { const e = byEx[s.ex] = byEx[s.ex] || {}; (e[s.date] = e[s.date] || []).push(s); });
  for (const ex in byEx) {
    let bestW = 0, bestR = 0;
    for (const d of Object.keys(byEx[ex]).sort()) {
      let topW = 0, topR = 0;
      byEx[ex][d].forEach(s => {
        const wt = s.w > 0, v = wt ? e1rm(s.w, s.r) : s.r, best = wt ? bestW : bestR;
        if (wt) topW = Math.max(topW, v); else topR = Math.max(topR, v);
        const ratio = best > 0 ? v / best : 1;
        q.set(s.id, 0.5 + Math.min(1, Math.max(0, (ratio - 0.6) / 0.4)));
      });
      const ts = byEx[ex][d][0].ts;
      if (bestW > 0 && topW > bestW + 0.05) prs.push({ ex, date: d, ts, txt: `推定1RM ${r1(topW)}kg` });
      else if (bestR > 0 && topR > bestR) prs.push({ ex, date: d, ts, txt: `${topR}回` });
      bestW = Math.max(bestW, topW); bestR = Math.max(bestR, topR);
    }
  }
  const partOf = {}; allEx().forEach(x => (partOf[x.name] = x.part));
  const live = all.filter(s => s.ts >= since);
  let xp = 0; const pp = {}, pc = {}; G_PARTS.forEach(([p]) => { pp[p] = 0; pc[p] = 0; });
  const ev = new Map();
  const add = (date, type, c, why) => { const k = date + type; const e = ev.get(k) || { date, type, c: 0, why, n: 0 }; e.c += c; e.n++; ev.set(k, e); };
  const days = [];
  live.forEach(s => {
    const v = q.get(s.id) || 1; xp += 20 * v;
    const p = partOf[s.ex]; if (p in pp) { pp[p] += v; pc[p]++; }
    add(s.date, 's', COIN.set, '');
    if (!days.includes(s.date)) { days.push(s.date); add(s.date, 'd', COIN.day, 'トレーニングした日'); }
  });
  const wk = {}; days.forEach(d => { const k = startOf(d, 'week'); (wk[k] = wk[k] || []).push(d); });
  for (const k in wk) if (wk[k].length >= goal) add(wk[k].sort()[goal - 1], 'w', COIN.week, `週の目標（${goal}日）達成`);
  let prCount = 0;
  prs.filter(p => p.ts >= since).forEach(p => { prCount++; add(p.date, 'p' + p.ex, COIN.pr, `${p.ex} 自己ベスト ${p.txt}`); });
  const order = { w: 0, p: 1, d: 2, s: 3 };
  const events = [...ev.values()].map(e => (e.type === 's' ? { ...e, why: `セット記録 ${e.n}セット` } : e))
    .sort((a, b) => (a.date === b.date ? order[a.type[0]] - order[b.type[0]] : a.date < b.date ? 1 : -1));
  _sc = { key, xp, pp, pc, events, earned: events.reduce((a, e) => a + e.c, 0), prCount };
  return _sc;
}

// 週の目標と連続達成（筋トレは休む日も大事なので、日ではなく週で数える）
function weekInfo() {
  const goal = Math.max(1, +S.settings.weekGoal || 3);
  const days = [...new Set(S.sets.filter(s => !s.del).map(s => s.date))];
  const wk = {}; days.forEach(d => { const k = startOf(d, 'week'); wk[k] = (wk[k] || 0) + 1; });
  const cw = startOf(today(), 'week'), n = wk[cw] || 0;

}

    g += `<circle cx="${X - 7}" cy="38" r="2.3" fill="${OL}"/><circle cx="${X + 7}" cy="38" r="2.3" fill="${OL}"/>`;

// ---------- バトル（ターンごとに行動を選ぶ） ----------
const MAXT = 15, KI_MAX = 3;
function hit(a, d) { const crit = Math.random() < 0.1; return { v: Math.max(1, Math.round(a * (0.85 + Math.random() * 0.3) * (crit ? 1.5 : 1) - d * 0.5)), crit }; }
const bNew = (p, bh, ki) => ({ ph: p.hp, bh, ki, charged: false, t: 0, over: null });
function bTurn(st, p, b, act) {
  const ev = []; let guard = false;
  if (act === 'sp' && st.ki < KI_MAX) act = 'atk';
  if (act === 'atk') { const h = hit(p.atk, b.def); st.bh = Math.max(0, st.bh - h.v); st.ki = Math.min(KI_MAX, st.ki + 1); ev.push({ k: 'atk', ...h }); }
  else if (act === 'sp') { const v = Math.max(2, Math.round(p.atk * 2.4 * (0.9 + Math.random() * 0.2) - b.def * 0.3)); st.bh = Math.max(0, st.bh - v); st.ki = 0; ev.push({ k: 'sp', v }); }
  else { guard = true; st.ki = Math.min(KI_MAX, st.ki + 2); ev.push({ k: 'grd' }); }
  if (!st.bh) st.over = 'win';
  else {
    if (st.charged) { const h = hit(b.atk * 2, p.def); const v = guard ? Math.ceil(h.v * 0.35) : h.v; st.charged = false; st.ph = Math.max(0, st.ph - v); ev.push({ k: 'heavy', v, guard }); }

      <p class="small">開始時の気合 <span class="kidots">${kiDots(ki)}</span> <span class="muted">今日4セットごとに+1</span></p>
      <button class="primary" data-gfight="1" ${fs.ok ? '' : 'disabled'}>⚔️ 戦う</button><p class="small ${fs.ok ? 'upc' : 'muted'}">${fs.msg}</p>
      <p class="muted small">あなた：⚔️${h.atk} 🛡️${h.def} ❤️${h.hp}<br>こうげき・ぼうぎょ・必殺技を選んで戦います（${MAXT}ターン以内）</p></section>`;
    x += `<section class="card"><h3>ボス一覧</h3><ul class="blist">${BOSSES.map((b, i) => `<li class="${i < g.beaten ? 'done' : i === g.beaten ? 'cur' : 'lock'}"><span>${i <= g.beaten ? bossSvg(b.art) : '❓'}</span><span>${i <= g.beaten ? esc(b.name) : '？？？'}</span><small>${i < g.beaten ? `✓ ${itemById(b.reward).icon} ${esc(itemById(b.reward).name)}` : i === g.beaten ? '挑戦中' : ''}</small></li>`).join('')}
      <li class="${g.beaten >= BOSSES.length ? 'cur' : 'lock'}"><span>${g.beaten >= BOSSES.length ? bossSvg('champ') : '❓'}</span><span>${g.beaten >= BOSSES.length ? `闘技場（Lv${g.beaten - BOSSES.length + 1}挑戦中）` : '？？？'}</span><small>全ボス撃破後</small></li></ul></section>`;
  }
  x += `<button class="ghost danger-t" data-greset="1">冒険をリセット</button>${g.since ? `<p class="muted small pad">${new Date(g.since).toLocaleString('ja-JP', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })} にリセット。これ以降の記録で育成中</p>` : ''}`;
  el.innerHTML = x;
}

function resetDialog() {
  return dialog(`<h3>冒険をリセットしますか？</h3>
    <p class="small">レベル・筋肉・コイン・装備・アイテム・ボスの進み具合がすべて最初に戻ります。<br>リセット後は、これから記録するトレーニングでキャラクターが育ちます。</p>
    <p class="small muted">トレーニングの記録そのものは消えません。リセットは元に戻せません。</p>
    <div class="row2"><button class="ghost" data-c="0">キャンセル</button><button class="primary danger" data-c="1">リセット</button></div>`,
  (m, close) => {
    m.querySelector('.sheet').onclick = e => {
      const b = e.target.closest('[data-c]'); if (!b) return;
      if (b.dataset.c === '1') {
        for (const k of Object.keys(S.game || {})) delete S.game[k];
        S.game.cv = 2; S.game.since = Date.now(); gstate(); gtab = 'muscle'; gtouch(); window.scrollTo(0, 0); toast('冒険をリセットしました');
      }
      close(null);
    };
  });
}

function shopDialog(id) {
  const it = itemById(id), g = gstate(), h = hero();
  const own = g.owned.includes(id), can = h.coins >= it.price;
  const preview = { ...g.equip, [it.slot]: it.id };
  return dialog(`<div class="shopdlg"><div class="pv">${charSvg(h.pl, preview)}</div>
    <h3>${it.icon} ${esc(it.name)}</h3><p>${statLine(it)}</p>
    <p>${own ? '所持しています' : `価格 🪙${it.price.toLocaleString()}（所持 🪙${Math.max(0, h.coins).toLocaleString()}）`}</p>
    <div class="row2"><button class="ghost" data-c="0">閉じる</button>${own ? `<button class="primary" data-c="eq">装備する</button>` : `<button class="primary" data-c="buy" ${can ? '' : 'disabled'}>${can ? '購入して装備' : 'コイン不足'}</button>`}</div></div>`,
  (m, close) => {
    m.querySelector('.sheet').onclick = e => {
      const b = e.target.closest('[data-c]'); if (!b || b.disabled) return;
      if (b.dataset.c === 'buy') {
        if (hero().coins < it.price) return toast('コインが足りません');
        g.spent += it.price; g.owned.push(it.id); g.equip[it.slot] = it.id; gtouch(); toast(`${it.name}を購入しました`);
      }
      if (b.dataset.c === 'eq') { g.equip[it.slot] = it.id; gtouch(); }
      close(null);
    };
  });
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-gtab],[data-geq],[data-gitem],[data-gfight],[data-greset]'); if (!b) return;
  if (b.dataset.greset) { resetDialog(); return; }
  const d = b.dataset, g = gstate();
  if (d.gtab) { gtab = d.gtab; renderGame(); return; }
  if (d.geq) { const it = itemById(d.geq); if (g.equip[it.slot] === it.id) delete g.equip[it.slot]; else g.equip[it.slot] = it.id; gtouch(); return; }
  if (d.gitem) { shopDialog(d.gitem); return; }
  if (d.gfight) { fight(); }
});

</script>
</body>
</html>
