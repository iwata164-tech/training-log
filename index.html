    const it = itemById((equip || {})[slot]);
    if (!it) return `<span class="gi none"></span>`;
    names.push(`${l} ${it.name}`);
    return `<span class="gi ${it.special ? 'sp' : ''} ${o.hl === it.id ? 'new' : ''}" style="--c:${it.c}">${it.icon}</span>`;
  }).join('');
  const label = `装備：${names.join('、') || 'なし'}`;
  return o.btn ? `<button class="gear" data-gtab="equip" aria-label="${esc(label)}（タップで装備を変える）">${tiles}</button>`
    : `<div class="gear ${o.cls || ''}" role="img" aria-label="${esc(label)}">${tiles}</div>`;
}

function drawHeroOld(pl, equip, mood, pose) {
  const G = k => 0.2 + 0.8 * Math.min(1, (pl[k] || 0) / 10); // Lv0でもある程度がっしり、Lv10で参考体型
  const c = G('胸'), b = G('背中'), sh = G('肩'), bi = G('二頭'), tr = G('三頭'), fa = G('前腕'), ab = Math.min(1, (pl['腹'] || 0) / 10), gl = G('臀部'), lg = G('脚');
  const E = {}; for (const [k, id] of Object.entries(equip)) { const it = itemById(id); if (it) E[k] = it; }
  const B = pixBuf(), flex = pose === 'flex', cross = pose === 'cross';
  const sw = (12 + 6 * b + 3.5 * c) * 0.9, w = 10 + 2 * ab + 2.5 * gl;           // 胸まわりの半幅・ウエストの半幅
  const dr = (3.6 + 4 * sh) * 0.9, aR = (3.4 + 3.6 * Math.max(bi, tr)) * 0.9, fR = (2.8 + 2.4 * fa) * 0.9;
  const ax = sw + aR - 2.2, fistR = 2.6 + 1.2 * fa;
  const TOP = E.top ? pTone(E.top.c) : null;
  const palOf = t => (t === 'skin' ? SKN : t === 'top' && TOP ? TOP : null);
  const det = (x, y, k = 's') => { const p = palOf(B.tag(Math.round(x), Math.round(y))); if (p) B.set(x, y, p[k]); };

  // マント（体の後ろ）
  if (E.back) B.poly([[P_X - sw + 3, 22], [P_X + sw - 3, 22], [P_X + sw + 6, 82], [P_X, 85], [P_X - sw - 6, 82]], pTone(E.back.c), { shade: (x) => (x - P_X) / (sw + 6) * 1.2 });
  // 脚（上半身に負けない長さと太さ）
  const lx = (5 + 2.4 * lg + 1.2 * gl) * 1.1, tR = (5.4 + 4 * lg) * 1.2, cR = (3.4 + 2.8 * lg) * 1.2;
  for (const sg of [-1, 1]) {
    // 太もも（腰から膝へ細くなる）・ふくらはぎ・靴
    B.shape((x, y) => { const t = (y - 58) / 22; if (t < 0 || t > 1) return false; const r = tR * (0.86 + 0.5 * Math.sin(Math.PI * Math.min(1, t * 1.6)) * 0.3 - 0.42 * t * t); return Math.abs(x - (P_X + sg * (lx + 0.6 * t))) <= r; },
      [P_X + sg * lx - tR - 2, 57, P_X + sg * lx + tR + 2, 81], SKN, { tag: 'skin', shade: (x, y) => 0.9 * (x - P_X - sg * lx) / tR + 0.25 });
    B.ell(P_X + sg * (lx + 1), 86, cR, 6.8, SKN, { tag: 'skin' });
    B.ell(P_X + sg * (lx + 1.6), 93.5, 4.6 + 0.8 * lg, 2.3, SHOES);
    for (let y = 66; y <= 74; y++) det(P_X + sg * (lx + tR * 0.15 + (y - 66) * 0.2), y, 's');
    det(P_X + sg * (lx + 1) - sg * cR * 0.4, 83, 'h');
  }
  // 短パン
  const SP = pTone(E.bottom ? E.bottom.c : '#4b525e');
  const sb = lx + tR + 0.8;
  B.poly([[P_X - w - 2, 52], [P_X + w + 2, 52], [P_X + sb, 64.5], [P_X + 1, 64.5], [P_X, 60], [P_X - 1, 64.5], [P_X - sb, 64.5]], SP, { tag: 'sp', shade: (x, y) => (x - P_X) / (w + 4) * 0.9 + (y > 63 ? 0.6 : 0) });
  for (let x = Math.round(P_X - w - 1); x <= P_X + w + 1; x++) B.set(x, 53, SP.s);
  // 胴体（胸から腰へ、なだらかに細くなる）
  const hw = y => (y < 31 ? sw : sw + (w - sw) * ((y - 31) / 23) ** 1.15);
  B.shape((x, y) => y >= 21 && y <= 54 && Math.abs(x - P_X) <= hw(y), [P_X - sw - 1, 20, P_X + sw + 1, 55], SKN, { tag: 'skin', shade: (x, y) => (x - P_X) / hw(y) * 0.9 - 0.15 });
  // 服（体にぴったり）
  if (E.top && (E.top.look === 'tank' || E.top.look === 'jersey'))
    B.shape((x, y) => y >= 22 && y <= 54 && Math.abs(x - P_X) <= hw(y) - (y < 30 ? 2 : 0), [P_X - sw, 21, P_X + sw, 55], TOP, { tag: 'top', out: 'none', shade: (x, y) => (x - P_X) / hw(y) * 0.9 - 0.15 });
  // 僧帽筋（首が埋まるくらいの盛り上がり）
  B.ell(P_X, 21.5, 6.5 + 6 * b, 5 + 2.5 * b, SKN, { tag: 'skin', out: 'bg' });
  // 胸筋
  const pr = 5.6 + 3.4 * c, pry = 3.8 + 2.4 * c, pcy = 29.5 + c;
  for (const sg of [-1, 1]) {
    const pcx = P_X + sg * (pr - 0.3);
    for (let x = Math.round(pcx - pr); x <= pcx + pr; x++) { const u = (x + 0.5 - pcx) / pr; if (Math.abs(u) > 1) continue; const y = Math.round(pcy + pry * Math.sqrt(1 - u * u)); det(x, y, 'd'); det(x, y - 1, 's'); }
    det(pcx - sg * pr * 0.3, pcy - pry * 0.4, 'h'); det(pcx - sg * pr * 0.3 + 1, pcy - pry * 0.4, 'h');
  }
  for (let y = Math.round(pcy - pry + 1); y <= pcy + pry; y++) det(P_X, y, 'd');
  // 腹筋
  const aTop = Math.round(pcy + pry + 2);
  for (let y = aTop; y <= 51; y++) det(P_X, y, ab > 0.25 ? 'd' : 's');
  const rows = ab > 0.15 ? [aTop + 3.5, aTop + 8, aTop + 12.5] : [];
  rows.forEach((ry, i) => { if (ry > 51) return; for (let dx = 1; dx <= 3 + 2 * ab - i * 0.4; dx++) { det(P_X - dx, ry, 's'); det(P_X + dx, ry, 's'); } });
  if (ab > 0.4) [aTop + 1, aTop + 5.5, aTop + 10].forEach(ry => { det(P_X - 2, ry, 'h'); det(P_X + 2, ry, 'h'); });
  // 脇腹の影
  for (const sg of [-1, 1]) for (let y = 34; y <= 44; y += 3) det(P_X + sg * (hw(y) - 2), y, 's');
  // よろい（胸当て）
  if (E.top && (E.top.look === 'armor' || E.top.look === 'scale')) {
    B.shape((x, y) => y >= 22 && Math.abs(x - P_X) <= hw(y) && y <= 36 + 3 * Math.cos(((x - P_X) / sw) * 1.5), [P_X - sw, 21, P_X + sw, 40], TOP, { tag: 'top', shade: (x, y) => (x - P_X) / sw * 0.9 - 0.1 });
    for (let y = 24; y <= 38; y++) det(P_X, y, 'd');
    if (E.top.look === 'scale') for (let y = 25; y <= 36; y += 3) for (let x = P_X - sw + 3 + (y % 2); x < P_X + sw - 2; x += 3) det(x, y, 's');
    else { det(P_X - 3, 26, 'h'); det(P_X + 3, 26, 'h'); }
  }
  // ネクタイ
  if (E.acc && E.acc.look === 'tie') {
    const tc = pTone(E.acc.c);
    B.poly([[P_X - 1.5, 21], [P_X + 1.5, 21], [P_X + 1, 23.5], [P_X - 1, 23.5]], tc);
    B.poly([[P_X - 1, 23.5], [P_X + 1, 23.5], [P_X + 2.4, 38], [P_X, 41], [P_X - 2.4, 38]], tc, { shade: x => (x - P_X) / 2 });
  }
  // ベルト
  if (E.acc && (E.acc.look === 'belt' || E.acc.look === 'champ')) {
    const big = E.acc.look === 'champ', bp = pTone(E.acc.c);
    B.poly([[P_X - w - 2, big ? 49 : 50], [P_X + w + 2, big ? 49 : 50], [P_X + w + 2, 53], [P_X - w - 2, 53]], bp, { shade: x => (x - P_X) / w });
    if (big) B.ell(P_X, 51, 3.5, 2.6, pTone('#f6dc6b')); else B.poly([[P_X - 1.5, 50], [P_X + 1.5, 50], [P_X + 1.5, 53], [P_X - 1.5, 53]], pTone('#c9a227'));
  }
  // 腕
  const glove = E.acc && E.acc.look === 'glove' ? pTone(E.acc.c) : SKN;
  const bangle = E.acc && E.acc.look === 'bangle' ? pTone(E.acc.c) : null;
  for (const sg of [-1, 1]) {
    const sx = P_X + sg * (sw - 1);
    if (flex) {
      const ex = P_X + sg * (sw + 9);
      B.cap(ex, 27, ex, 14, fR, SKN, { tag: 'skin' });
      if (bangle) B.cap(ex, 17, ex, 18, fR + 0.6, bangle);
      B.ell(ex, 10.5, fistR + 0.4, fistR, glove, { tag: 'skin' });
      B.cap(sx, 27, ex, 27, 3 + 1.5 * bi, SKN, { tag: 'skin' });
      B.ell(P_X + sg * (sw + 4), 25 - bi, 3.2 + 2.6 * bi, 2.6 + 2.6 * bi, SKN, { tag: 'skin' });
      det(P_X + sg * (sw + 4) - 1, 23 - 2 * bi, 'h');
    } else {
      const ux = P_X + sg * ax;
      B.ell(ux, cross ? 34.5 : 36, aR, cross ? 9.5 : 10.5, SKN, { tag: 'skin' });
      for (let y = 31; y <= 40; y += 3) det(ux - sg * aR * 0.35, y, 's'); // 上腕のくびれ
      det(ux + sg * aR * 0.25 - 1, 31, 'h');
      if (!cross) {
        B.ell(ux + sg, 49, fR, 7.5, SKN, { tag: 'skin' });
        if (bangle) B.poly([[ux + sg - fR - 0.5, 52], [ux + sg + fR + 0.5, 52], [ux + sg + fR + 0.5, 54], [ux + sg - fR - 0.5, 54]], bangle);
        B.ell(ux + sg, 57.5, fistR, fistR, glove, { tag: 'skin' });
        det(ux + sg - 1, 58, 's'); det(ux + sg + 1, 58, 's');
      }
    }
    // 三角筋（丸く大きな肩）
    B.ell(sx, 25.5, dr, dr * 0.95, SKN, { tag: 'skin' });
    det(sx - 1.5, 24 - dr * 0.4, 'h');
    if (E.top && (E.top.look === 'armor' || E.top.look === 'scale')) B.ell(sx, 24, dr + 1.4, dr * 0.75, TOP, { tag: 'top', clip: (x, y) => y <= 25 });
    if (E.top && E.top.look === 'jersey') B.ell(sx, 25.5, dr + 0.8, dr + 0.6, TOP, { tag: 'top' });
  }
  if (cross) {
    const e = ax + 1, fr2 = fR * 0.85;
    B.cap(P_X + e, 43, P_X - e + 5, 37.5, fr2, SKN, { tag: 'skin' });
    B.ell(P_X - e + 3, 37, fistR * 0.9, fistR * 0.9, glove, { tag: 'skin' });
    B.cap(P_X - e, 46, P_X + e - 5, 40.5, fr2, SKN, { tag: 'skin' });
    if (bangle) B.cap(P_X + e - 10, 41.8, P_X + e - 9, 41.6, fr2 + 0.8, bangle);
    B.ell(P_X + e - 3, 40, fistR * 0.9, fistR * 0.9, glove, { tag: 'skin' });
  }
  // 武器（右手・立ちポーズ）
  const W = E.hand, fx = P_X + ax + 1, fy = 57.5;
  if (W && !flex && !cross) {
    const wc = pTone(W.c), wood = pTone('#8a5a32'), gold = pTone('#c9a227');
    if (W.look === 'dumbbell') { B.cap(fx - 7, fy, fx + 7, fy, 0.8, pTone('#9aa3ad')); B.poly([[fx - 9, fy - 4], [fx - 6, fy - 4], [fx - 6, fy + 4], [fx - 9, fy + 4]], wc); B.poly([[fx + 6, fy - 4], [fx + 9, fy - 4], [fx + 9, fy + 4], [fx + 6, fy + 4]], wc); }
    if (W.look === 'bokken') B.cap(fx, fy + 3, fx + 9, fy - 30, 1.3, pTone('#b07a42'));
    if (W.look === 'sword') { B.cap(fx + 1, fy - 3, fx + 10, fy - 34, 1.4, wc); B.cap(fx - 3, fy - 2, fx + 4, fy - 4, 1, gold); }
    if (W.look === 'hammer') { B.cap(fx, fy + 3, fx + 6, fy - 24, 1, wood); B.poly([[fx + 1, fy - 32], [fx + 12, fy - 29], [fx + 10, fy - 21], [fx - 1, fy - 24]], wc); }
    if (W.look === 'axe') { B.cap(fx, fy + 3, fx + 6, fy - 26, 1, wood); B.poly([[fx + 5, fy - 26], [fx + 14, fy - 31], [fx + 13, fy - 17], [fx + 4, fy - 19]], wc); }
    if (W.look === 'great') { B.cap(fx + 1, fy - 4, fx + 11, fy - 40, 2.4, wc); B.cap(fx - 3, fy - 3, fx + 5, fy - 5, 1.2, pTone('#2a2a2a')); for (let i = 0; i < 6; i++) B.set(fx + 3 + i * 1.4, fy - 12 - i * 5, '#d6b5ff'); }
    B.ell(fx, fy, fistR, fistR, glove, { tag: 'skin' });
  }
  // 頭
  for (const sg of [-1, 1]) B.ell(P_X + sg * 7.4, 13, 1.6, 2.4, SKN, { tag: 'skin' });
  B.ell(P_X, 12, 7, 8, SKN, { tag: 'skin' });
  // 黒の短髪（上が平らで、横は短く）
  B.shape((x, y) => ((x - P_X) / 7.4) ** 2 + ((y - 10.5) / 7.6) ** 2 <= 1 && (y <= 7.2 || (Math.abs(x - P_X) >= 5.6 && y <= 10)), [P_X - 8, 2, P_X + 8, 11], HAIRP, { tag: 'hair', shade: (x, y) => (x - P_X) / 8 + (y - 5) / 6 - 0.2 });
  for (let x = P_X - 5; x <= P_X + 5; x += 2) B.set(x, 3, HAIRP.h);
  // 顔
  const D = P_OL, br = HAIRP.b, red = '#8a2f2f', set = B.set;
  const brows = (lo, li, ro, ri) => { for (let i = 0; i < 4; i++) { set(P_X - 5 + i, Math.round(lo + (li - lo) * i / 3), br); set(P_X + 5 - i, Math.round(ro + (ri - ro) * i / 3), br); } };
  set(P_X, 15, SKN.s); set(P_X + 1, 15, SKN.s); // 鼻
  if (mood === 'happy') {
    brows(9, 9, 9, 9);
    for (const sg of [-1, 1]) { set(P_X + sg * 4, 13, D); set(P_X + sg * 3, 12, D); set(P_X + sg * 2, 13, D); }
    for (let x = -2; x <= 2; x++) set(P_X + x, 17, D); for (let x = -1; x <= 1; x++) set(P_X + x, 18, red);
  } else if (mood === 'hurt') {
    brows(11, 9, 11, 9);
    set(P_X - 4, 12, D); set(P_X - 3, 13, D); set(P_X - 4, 14, D); set(P_X + 4, 12, D); set(P_X + 3, 13, D); set(P_X + 4, 14, D);
    [[-2, 18], [-1, 17], [0, 18], [1, 17], [2, 18]].forEach(([x, y]) => set(P_X + x, y, D));
  } else {
    if (mood === 'fight') brows(9, 11, 9, 11); else brows(10, 10, 10, 10);
    for (const sg of [-1, 1]) { set(P_X + sg * 4, 13, D); set(P_X + sg * 3, 13, D); set(P_X + sg * 3, 12, mood === 'fight' ? br : SKN.b); }
    if (mood === 'fight') for (let x = -2; x <= 2; x++) set(P_X + x, 17, D);
    else { for (let x = -1; x <= 1; x++) set(P_X + x, 17, SKN.d); set(P_X - 2, 16, SKN.d); set(P_X + 2, 16, SKN.d); }
  }
  // 頭の装備（顔は隠さない）
  if (E.head) {
    const h = E.head, hp = pTone(h.c);
    if (h.look === 'band') { B.poly([[P_X - 7.5, 6.5], [P_X + 7.5, 6.5], [P_X + 7.5, 8.7], [P_X - 7.5, 8.7]], hp, { clip: (x, y) => B.tag(x, y) === 'skin' || B.tag(x, y) === 'hair' || B.tag(x, y) === 'ol', out: 'none' }); B.cap(P_X + 8, 7, P_X + 12, 5, 0.8, hp); B.cap(P_X + 8, 8, P_X + 11, 11, 0.8, hp); }
    if (h.look === 'cap') { B.ell(P_X, 8, 7.8, 5.4, hp, { clip: (x, y) => y <= 7 }); B.poly([[P_X - 1, 7], [P_X + 11, 7], [P_X + 11, 8.6], [P_X - 1, 8.6]], hp); }
    if (h.look === 'helm' || h.look === 'viking') { B.ell(P_X, 8, 8.2, 6.6, hp, { clip: (x, y) => y <= 8 }); for (let x = P_X - 7; x <= P_X + 7; x++) B.set(x, 7, hp.s); B.set(P_X - 2, 3, hp.h); B.set(P_X - 1, 3, hp.h); }
    if (h.look === 'viking') for (const sg of [-1, 1]) { B.cap(P_X + sg * 7, 5, P_X + sg * 11, 1, 1.4, pTone('#efe6cf')); B.cap(P_X + sg * 11, 1, P_X + sg * 11, -3, 1, pTone('#efe6cf')); }
    if (h.look === 'horns') { for (const sg of [-1, 1]) { B.cap(P_X + sg * 6, 5, P_X + sg * 12, 1, 1.7, pTone('#efe6cf')); B.cap(P_X + sg * 12, 1, P_X + sg * 12, -3, 1.1, pTone('#efe6cf')); } B.cap(P_X - 7, 6.5, P_X + 7, 6.5, 1.2, hp); }
    if (h.look === 'crown') { B.poly([[P_X - 5, 4.5], [P_X - 6, -1.5], [P_X - 2.5, 1.5], [P_X, -3], [P_X + 2.5, 1.5], [P_X + 6, -1.5], [P_X + 5, 4.5]], hp, { shade: x => (x - P_X) / 6 }); B.set(P_X, 2, '#d23a3a'); }
  }
  B.w = P_W; B.h = P_H; B.ax = ax; B.fR = fR; // ポーズの組み直し用
  return B;
}

const HERO_ROWS = HERO_RLE.split('/').map(r => r.replace(/(\d*)([A-N.])/g, (_, n, c) => (c === '.' ? c : (c.charCodeAt(0) - 65).toString(16)).repeat(n ? +n : 1)));
// 64×115 の元絵（筋肉Lv最大の姿）を、筋肉レベルに応じて「列を抜いて」細くする。
// 抜くのは腕・胸・脚の内側の列だけなので、輪郭線やドットの形はくずれない。
// 0=輪郭 1,2=髪 3,4,5,6=肌(基本/影/明るい/濃い影) 7,8,9=短パン a〜d=靴
// ポーズは3つ：通常＝リラックスポーズ（元絵の立ち姿）／勝ったとき＝ダブルバイセップス／負けたとき＝体育座り。
// 勝ち・負けのポーズは、立ち姿の部品を組み直して腕やひざを描き足すので、どのセットでも元絵は立ち姿1枚でよい。
// 装備は体に重ねず、キャラクターの下に並べて見せる（gearHtml）。
const HERO_W = 88, HERO_H = 118, HERO_OX = 12, HERO_OY = 2, HERO_CX = 32;
const HERO_SKIN = { '3': 'b', '4': 's', '5': 'h', '6': 'd' };

// ドット絵を描くための板。円・カプセル・多角形を、輪郭線つきで置ける。
function heroBuf(w = HERO_W, h = HERO_H, OLC = P_OL) {
  const C = new Array(w * h).fill(null), T = new Array(w * h).fill(null);
  const inb = (x, y) => x >= 0 && x < w && y >= 0 && y < h, ix = (x, y) => y * w + x;
  const N4 = [[1, 0], [-1, 0], [0, 1], [0, -1]], isOl = t => t === 'ol' || t === 'fo'; // fo=顔の線（薄くしない）
  const B = {
    w, h, C, T, tag: (x, y) => (inb(x, y) ? T[ix(x, y)] : null),
    set(x, y, c, t) { x = Math.round(x); y = Math.round(y); if (!inb(x, y)) return; C[ix(x, y)] = c; if (t) T[ix(x, y)] = t; },
    shape(test, bb, pal, o = {}) {
      const m = [], S = new Set();
      for (let y = Math.floor(bb[1]); y <= Math.ceil(bb[3]); y++) for (let x = Math.floor(bb[0]); x <= Math.ceil(bb[2]); x++)
        if (inb(x, y) && (!o.clip || o.clip(x, y)) && test(x + 0.5, y + 0.5)) { m.push([x, y]); S.add(ix(x, y)); }
      const out = o.out || 'all';
      // 何もない所は輪郭線。すでに肌がある所（＝手前に重なる所）は、o.inner があればその薄い色の線にする
      if (out !== 'none') for (const [x, y] of m) for (const [dx, dy] of N4) {
        const nx = x + dx, ny = y + dy; if (!inb(nx, ny)) continue; const k = ix(nx, ny);
        if (S.has(k) || (out === 'bg' && C[k])) continue;
        if (C[k] && o.inner) { if (T[k] === 'skin') C[k] = o.inner; if (T[k] === 'skin' || isOl(T[k])) continue; }
        C[k] = OLC; T[k] = 'ol';
      }
      for (const [x, y] of m) { let c = pal.b; if (o.shade) { const d = o.shade(x + 0.5, y + 0.5); c = d > 0.5 ? pal.s : d < -0.6 ? pal.h : pal.b; } C[ix(x, y)] = c; T[ix(x, y)] = o.tag || 'x'; }
      return m;
    },
    ell(cx, cy, rx, ry, pal, o = {}) {
      return B.shape((x, y) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1, [cx - rx - 1, cy - ry - 1, cx + rx + 1, cy + ry + 1], pal,
        { shade: o.flat ? null : (x, y) => 0.55 * (x - cx) / rx + 0.8 * (y - cy) / ry, ...o });
    },
    cap(x1, y1, x2, y2, r, pal, o = {}) {
      const dx = x2 - x1, dy = y2 - y1, L2 = dx * dx + dy * dy || 1, len = Math.sqrt(L2);
      let nx = -dy / len, ny = dx / len; if (0.55 * nx + 0.8 * ny < 0) { nx = -nx; ny = -ny; }
      const near = (x, y) => { const t = Math.max(0, Math.min(1, ((x - x1) * dx + (y - y1) * dy) / L2)); return [x1 + t * dx, y1 + t * dy]; };
      return B.shape((x, y) => { const [px, py] = near(x, y); return (x - px) ** 2 + (y - py) ** 2 <= r * r; },
        [Math.min(x1, x2) - r - 1, Math.min(y1, y2) - r - 1, Math.max(x1, x2) + r + 1, Math.max(y1, y2) + r + 1], pal,
        { shade: o.flat ? null : (x, y) => { const [px, py] = near(x, y); return ((x - px) * nx + (y - py) * ny) / r; }, ...o });
    },
    poly(pts, pal, o = {}) {
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      const test = (x, y) => { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const [xi, yi] = pts[i], [xj, yj] = pts[j]; if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c; } return c; };
      return B.shape(test, [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)], pal, o);
    },
    // 別の板 A の四角い範囲を、(dx,dy) だけずらして写す
    copy(A, x0, y0, x1, y1, dx = 0, dy = 0) {
      for (let y = Math.max(0, y0); y <= Math.min(A.h - 1, y1); y++) for (let x = Math.max(0, x0); x <= Math.min(A.w - 1, x1); x++) {
        const k = y * A.w + x; if (A.C[k]) B.set(x + dx, y + dy, A.C[k], A.T[k] || 'x');
      }
    },
    // 切り口など、輪郭線のない所を輪郭線で閉じる
    seal() {
      const add = [];
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (C[ix(x, y)]) continue;
        if (N4.some(([dx, dy]) => inb(x + dx, y + dy) && C[ix(x + dx, y + dy)] && !isOl(T[ix(x + dx, y + dy)]))) add.push(ix(x, y));
      }
      add.forEach(k => { C[k] = OLC; T[k] = 'ol'; });
      return B;
    },
    // 体の内側に残った輪郭線（肌と肌の重なりの線）を、薄い色 c にする。外まわりの輪郭線はそのまま
    soften(c, y0 = 0, y1 = h - 1) {
      const hit = [];
      for (let y = Math.max(1, y0); y <= Math.min(h - 2, y1); y++) for (let x = 1; x < w - 1; x++) {
        if (T[ix(x, y)] !== 'ol') continue;
        let open = false; for (let dy = -1; dy <= 1 && !open; dy++) for (let dx = -1; dx <= 1; dx++) if (!C[ix(x + dx, y + dy)]) { open = true; break; }
        if (open) continue;
        const nb = N4.map(([dx, dy]) => T[ix(x + dx, y + dy)]).filter(t => t !== 'ol');
        if (nb.length && nb.every(t => t === 'skin')) hit.push(ix(x, y));
      }
      hit.forEach(k => { C[k] = c; T[k] = 'skin'; });
      return B;
    },
  };
  return B;
}

// 通常の立ち姿（リラックスポーズ）。筋肉レベルに合わせて列を抜き、表情を描く。
function heroStand(pl, mood, set) {
  const G = k => Math.min(1, (pl[k] || 0) / 10);
  const arm = (G('肩') + G('二頭') + G('三頭') + G('前腕')) / 4, chest = (G('胸') + G('背中')) / 2, leg = (G('脚') + G('臀部')) / 2, ab = G('腹');
  // 1) 元絵を色＋種類の表にする
  const R = set.rows.map(r => r.split('').map(k => (k === '.' ? null : { c: set.pal[parseInt(k, 16)], k })));
  const at = (x, y) => (R[y] && R[y][x]) || null;
  // skin2：もう1組の「肌」の色番号（シャチの白いお腹など）
  const S2 = set.skin2 || {}, role = k => HERO_SKIN[k] || S2[k], key2 = r => Object.keys(S2).find(k => S2[k] === r);
  const skin = { b: set.pal[3], s: set.pal[4], h: set.pal[5], d: set.pal[6] };

  // 腹筋が弱いうちは割れ目を薄くする
  if (ab < 0.6) for (let y = 37; y <= 50; y++) for (let x = 19; x <= 44; x++) {
    const p = at(x, y); if (!p || x === 31 || x === 32) continue;
    if (p.k === '5') { p.k = '3'; p.c = skin.b; }
    if (p.k === '6' || (ab < 0.25 && p.k === '4')) { p.k = ab < 0.25 ? '3' : '4'; p.c = ab < 0.25 ? skin.b : skin.s; }
    const r2 = S2[p.k];
    if (r2 === 'h') { p.k = key2('b'); p.c = set.pal[parseInt(p.k, 16)]; }
    else if (r2 === 'd' || (ab < 0.25 && r2 === 's')) { p.k = key2(ab < 0.25 ? 'b' : 's'); p.c = set.pal[parseInt(p.k, 16)]; }
  }
  // 顔（目は 12行目の 29,30 / 35,36、口は 16行目）
  const face = (x, y, k) => { if (k === '3' && set.faceSkin) k = set.faceSkin; R[y][x] = { c: k === 'r' ? '#8a2f2f' : set.pal[parseInt(k, 16)], k }; };
  if (set.noFace) { /* フードなどで顔が見えないセットは表情を描かない */ } else if (mood === 'happy') {
    [29, 30, 35, 36].forEach(x => face(x, 12, '3')); [[29, 11], [30, 11], [28, 12], [31, 12], [35, 11], [36, 11], [34, 12], [37, 12]].forEach(([x, y]) => face(x, y, '0'));
    [30, 31, 32, 33].forEach(x => face(x, 15, '0')); [31, 32].forEach(x => face(x, 16, 'r')); [30, 33].forEach(x => face(x, 16, '0'));
  } else if (mood === 'hurt') {
    [29, 30, 35, 36].forEach(x => face(x, 12, '3')); [[29, 11], [30, 12], [29, 13], [36, 11], [35, 12], [36, 13]].forEach(([x, y]) => face(x, y, '0'));
    [[30, 16], [31, 15], [32, 16], [33, 15]].forEach(([x, y]) => face(x, y, '0'));
  } else if (mood === 'fight') {
    [[29, 11], [34, 11]].forEach(([x, y]) => face(x, y, '1')); [30, 31, 32, 33].forEach(x => face(x, 16, '0'));
  }

  // 2) 筋肉レベルに合わせて列を抜く（中心から外側の列が内側へ寄る）
  const take = (list, n) => list.slice(0, Math.max(0, Math.min(list.length, Math.round(n))));
  const mir = l => l.map(x => 63 - x);
  const LEG = [23, 26, 21, 25];
  const armCols = take([11, 9, 13, 10, 12], (1 - arm) * 5), chestCols = take([28, 26], (1 - chest) * 2), legCols = take(LEG, (1 - leg) * 4);
  // legFrom：太ももが出ているセット用。legFrom行からlegFull行にかけて、抜く列を少しずつ増やす
  const legD = y => (set.legFrom && y >= set.legFrom && y < 73 ? take(LEG, (1 - leg) * 4 * Math.min(1, (y - set.legFrom + 1) / (set.legFull - set.legFrom + 1))) : []);
  const edgeOf = (e, y, none) => (e && y >= e[0] && y < e[0] + e[1].length ? e[1][y - e[0]] : none);
  const armEdge = y => edgeOf(set.armEdge, y, -1), armEdgeR = y => edgeOf(set.armEdgeR, y, 999);
  const del = y => {
    const d = [];
    if (y >= 18 && y <= 68) d.push(...armCols, ...mir(armCols));
    if (y >= 18 && y <= 50) d.push(...chestCols, ...mir(chestCols));
    if (y >= 73) d.push(...legCols, ...mir(legCols));
    else { const lc = legD(y); d.push(...lc, ...mir(lc)); }
    return new Set(d);
  };
  const mapX = (x, D) => (x < HERO_CX ? x + [...D].filter(d => d > x && d < HERO_CX).length : x - [...D].filter(d => d < x && d >= HERO_CX).length);
  const rowsD = R.map((_, y) => del(y));
  // 太ももを細くした行でも、横に下ろした腕（armEdge の列まで／armEdgeR の列から）は上の行とそろえる
  const X = (x, y) => HERO_OX + mapX(x, rowsD[y]) - (x <= armEdge(y) ? legD(y).filter(d => d > x && d < HERO_CX).length : 0) + (x >= armEdgeR(y) ? legD(y).length : 0);
  const tagOf = (k, y) => (k === '0' ? (y <= 17 ? 'fo' : 'ol') : k === '1' || k === '2' ? 'hair' : role(k) ? 'skin' : 'x');
  // 元絵の y0〜y1 行を板 D に置く。xf(x,y) が偽の列は置かない
  const stamp = (D, y0, y1, xf) => {
    for (let y = y0; y <= y1; y++) for (let x = 0; x < R[y].length; x++) {
      const p = R[y][x]; if (!p || rowsD[y].has(x) || (xf && !xf(x, y))) continue;
      D.set(X(x, y), HERO_OY + y, p.c, tagOf(p.k, y));
    }
  };
  const A = heroBuf(HERO_W, HERO_H, set.pal[0]);
  stamp(A, 0, R.length - 1);
  return { A, stamp, X, arm, skin, ln: pMix(skin.s, skin.d, 0.5), ol: set.pal[0], sp: set.pal[7] }; // ln：筋肉と筋肉の重なりの線（輪郭線より薄い）
}

// 勝ったとき：ダブルバイセップス。立ち姿から腕を外し、広背筋と、力こぶを作った腕を描き足す。
// 奥から手前の順に重ねる：広背筋 → 胴体 → 上腕（三頭・力こぶ） → 前腕 → 肩 → こぶし。
// 手前の部位が奥の部位に重なる所は、黒い輪郭線ではなく薄い線（st.ln）にする。
function heroBiceps(st, set) {
  const B = heroBuf(HERO_W, HERO_H, st.ol), sk = st.skin, Y = y => HERO_OY + y, a = st.arm, ln = st.ln;
  const keep = y => (y < 18 || y > 68 ? 0 : y <= 34 ? 19 : y <= 50 ? 18 : 17);
  const ua = 4 + 2.1 * a, fr = 3 + 1.3 * a, F = { tag: 'skin', inner: ln };
  const side = sg => { const e = st.X(sg < 0 ? 19 : 44, 28) + 0.5; return n => e + sg * n; };
  // 1) 広背筋（胴体の後ろ。わきの下から腰へ逆三角に）
  for (const sg of [-1, 1]) {
    const o = side(sg);
    B.poly([[o(-3), Y(25)], [o(5 + 2.5 * a), Y(27)], [o(4.5 + 2.5 * a), Y(33)], [o(0), Y(50)], [o(-4), Y(50)]], sk, { tag: 'skin', shade: (x, y) => (y - Y(29)) / 9 });
  }
  // 2) 胴体・頭・脚（腕の列は外す）
  st.stamp(B, 0, 114, (x, y) => x >= keep(y) && x <= 63 - keep(y));
  for (const sg of [-1, 1]) {
    const o = side(sg), sh = [o(3), Y(24)], el = [o(19), Y(20.5)], wr = [o(14.5), Y(7.5)];
    // 3) 上腕：下にたれる三頭 → 上に盛り上がる力こぶ → 腕の芯。ひとかたまりなので間に線は入れない
    B.ell(o(10.5), sh[1] + ua * 0.45, 7, ua * 0.95, sk, F);
    B.ell(o(11), el[1] - ua * 0.6, 5.6, ua * 0.95, sk, { tag: 'skin', out: 'bg' });
    B.cap(sh[0], sh[1], el[0], el[1], ua * 0.8, sk, { tag: 'skin', out: 'bg', flat: true });

// ---------- バトル（ターンごとに行動を選ぶ） ----------
const MAXT = 15, KI_MAX = 3;
function hit(a, d) { const crit = Math.random() < 0.1; return { v: Math.max(1, Math.round(a * (0.85 + Math.random() * 0.3) * (crit ? 1.5 : 1) - d * 0.5)), crit }; }
const bNew = (p, bh, ki) => ({ ph: p.hp, bh, ki, charged: false, t: 0, over: null });
function bTurn(st, p, b, act) {
  const ev = []; let guard = false;
  if (act === 'sp' && st.ki < KI_MAX) act = 'atk';
  if (act === 'atk') { const h = hit(p.atk, b.def); st.bh = Math.max(0, st.bh - h.v); st.ki = Math.min(KI_MAX, st.ki + 1); ev.push({ k: 'atk', ...h }); }
  else if (act === 'sp') { const v = Math.max(2, Math.round(p.atk * 2.4 * (0.9 + Math.random() * 0.2) - b.def * 0.3)); st.bh = Math.max(0, st.bh - v); st.ki = 0; ev.push({ k: 'sp', v }); }
  else { guard = true; st.ki = Math.min(KI_MAX, st.ki + 2); ev.push({ k: 'grd' }); }
  if (!st.bh) st.over = 'win';
  else {
    if (st.charged) { const h = hit(b.atk * 2, p.def); const v = guard ? Math.ceil(h.v * 0.35) : h.v; st.charged = false; st.ph = Math.max(0, st.ph - v); ev.push({ k: 'heavy', v, guard }); }
    else if (st.t % 3 === 2) { st.charged = true; ev.push({ k: 'charge' }); }
    else { const h = hit(b.atk, p.def); const v = guard ? Math.ceil(h.v / 2) : h.v; st.ph = Math.max(0, st.ph - v); ev.push({ k: 'batk', v, crit: h.crit, guard }); }
    st.t++;
    if (!st.ph) st.over = 'lose'; else if (st.t >= MAXT) st.over = 'timeout';
  }
  ev.forEach(e => { e.ki = st.ki; }); // 表示用
  return ev;
}
const autoAct = st => (st.charged ? 'grd' : st.ki >= KI_MAX ? 'sp' : 'atk');
function winRate(p, b, bh, ki) { let w = 0; const N = 200; for (let i = 0; i < N; i++) { const st = bNew(p, bh, ki); while (!st.over) bTurn(st, p, b, autoAct(st)); if (st.over === 'win') w++; } return Math.round((w / N) * 100); }
// 勝率は数字で見せず、手ごたえの言葉でぼかす
function feel(wr) { return wr >= 90 ? ['勝てそうだ', 'upc'] : wr >= 55 ? ['いい勝負になりそう', 'upc'] : wr >= 20 ? ['手ごわい相手だ', ''] : wr >= 3 ? ['かなり厳しい戦いになる', 'dnc'] : ['まだ歯が立たないかも…', 'dnc']; }
// 前回までに与えたダメージは引き継ぐ（ボスのHPは回復しない）
function bossHpLeft(g, boss) { return Math.max(1, boss.hp - Math.min(g.bossDmg || 0, boss.hp - 1)); }
// 今日のセット数で、開始時の気合が増える（4セットごとに1）
const startKi = () => Math.min(KI_MAX, Math.floor(S.sets.filter(s => !s.del && s.date === today()).length / 4));
const kiDots = n => Array.from({ length: KI_MAX }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('');
const SP_NAMES = { 胸: '大胸筋プレス', 背中: 'ラットスラム', 肩: 'ショルダータックル', 二頭: '力こぶアッパー', 三頭: 'トライセプスハンマー', 前腕: 'アイアングリップ', 腹: '腹筋ロケット', 臀部: 'ヒップアタック', 脚: 'スクワットキック' };
function spName(h) { let best = null; for (const p in h.pp) if (h.pp[p] > 0 && (!best || h.pp[p] > h.pp[best])) best = p; return best ? SP_NAMES[best] : 'マッスルスマッシュ'; }

// ボスに挑めるのは「今日トレーニングした日」に1回だけ
function fightStatus() {
  const g = gstate();
  if (g.lastFight === today()) return { ok: false, msg: '今日はもう戦いました。次にトレーニングした日にまた挑戦できます' };
  if (!S.sets.some(s => !s.del && s.date === today())) return { ok: false, msg: '今日トレーニングを記録すると、1回だけ挑戦できます' };
  return { ok: true, msg: '今日の挑戦権：残り1回' };
}
function fight() {
  const fs = fightStatus(); if (!fs.ok) { toast(fs.msg); return; }

      <div class="bt-log" id="bt-log" aria-live="polite"><div class="muted">行動を選ぼう。ボスが力をためたら「ぼうぎょ」が有効</div></div>
      <div id="bt-end"></div>
      <div class="bt-acts" id="bt-acts">
        <button class="bt-a" data-b="atk"><b>こうげき</b><small>気合+1</small></button>
        <button class="bt-a" data-b="grd"><b>ぼうぎょ</b><small>半減・気合+2</small></button>
        <button class="bt-a sp" data-b="sp"><b>${esc(sp)}</b><small>必殺技（気合3）</small></button>
      </div>
      <div class="row2" id="bt-sub"><button class="ghost" data-b="auto">おまかせで戦う</button><button class="ghost" data-b="run">にげる</button></div></div>`,
  (m, close) => {
    const q = s => m.querySelector(s), logEl = q('#bt-log');
    let busy = false, auto = false, done = false, timer = null;
    const bars = () => {
      q('#bt-ph').style.width = (st.ph / h.hp) * 100 + '%'; q('#bt-phn').textContent = `${st.ph}/${h.hp}`;
      q('#bt-bh').style.width = (st.bh / boss.hp) * 100 + '%'; q('#bt-bhn').textContent = `${st.bh}/${boss.hp}`;
    };
    const me = (mood, pose = 'relax') => { q('#bt-me').innerHTML = charSvg(h.pl, 'mini', pose, mood); };
    const bs = mood => { q('#bt-boss').innerHTML = bossSvg(boss.art, mood); };
    const shake = sel => { const el = q(sel); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); };
    const say1 = (txt, cls) => { const line = document.createElement('div'); line.className = cls; line.textContent = txt; logEl.prepend(line); };
    const ui = () => {
      q('#bt-turn').textContent = `ターン ${Math.min(st.t + 1, MAXT)} / ${MAXT}`;
      q('#bt-ki').innerHTML = kiDots(st.ki);
      m.querySelectorAll('.bt-a').forEach(b => { b.disabled = busy || auto || (b.dataset.b === 'sp' && st.ki < KI_MAX); });

      if (e.k === 'atk') { say1(`💪 あなたの攻撃！${e.crit ? '会心の一撃！' : ''} ${e.v}ダメージ`, 'me'); bs('hurt'); shake('#bt-boss'); me('fight'); }

const reduceMotion = () => typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;

      const x0 = f.left + f.width / 2 + (Math.random() * 40 - 20), y0 = f.top + 10 + Math.random() * 20;

      const an = c.animate([{ transform: 'translate(0,0) scale(1.1)', opacity: 0 }, { transform: 'translate(0,-26px) scale(1.2)', opacity: 1, offset: 0.25 }, { transform: `translate(${t.left - x0}px,${t.top - y0}px) scale(.6)`, opacity: 1 }], { duration: 850, delay: 120 + i * 80, easing: 'ease-in', fill: 'both' });
      an.onfinish = () => { c.remove(); const hc = document.querySelector('.hud-coin'); if (hc) { hc.classList.remove('bump'); void hc.offsetWidth; hc.classList.add('bump'); } };
    }
  }
}

      <p class="muted small">あなた：⚔️${h.atk} 🛡️${h.def} ❤️${h.hp}<br>こうげき・ぼうぎょ・必殺技を選んで戦います（${MAXT}ターン以内）</p></section>`;
    x += `<section class="card"><h3>ボス一覧</h3><ul class="blist">${BOSSES.map((b, i) => `<li class="${i < g.beaten ? 'done' : i === g.beaten ? 'cur' : 'lock'}"><span>${i <= g.beaten ? bossSvg(b.art) : '❓'}</span><span>${i <= g.beaten ? esc(b.name) : '？？？'}</span><small>${i < g.beaten ? `✓ ${itemById(b.reward).icon} ${esc(itemById(b.reward).name)}` : i === g.beaten ? '挑戦中' : ''}</small></li>`).join('')}

<script>
'use strict';
/* =========================================================
   報告の投稿（日・週・月・四半期・年）
   - 期間の統計をまとめた文章（編集できる）と、グラフ入りの報告画像を作る
   - 写真を追加できる（任意）
   - 「投稿する」でスマホの共有メニューを開き、X・Instagram・LINE などに投稿
     共有メニューが使えない環境では、画像を保存して文章をコピーする
   ========================================================= */
const RP_UNITS = [['day', '日'], ['week', '週'], ['month', '月'], ['quarter', '四半期'], ['year', '年']];
const RP_N = { week: 8, month: 12, quarter: 8, year: 5 };
const RP_PREV = { week: '先週', month: '前月', quarter: '前四半期', year: '前年' };
const RP_KIND = { day: 'デイリー', week: '週間', month: '月間', quarter: '四半期', year: '年間' };
const RP_MAX_PH = 9;
const rp = { unit: 'week', key: null, detail: false, img: true, hero: true, photos: [], blob: null, url: '', gen: 0, busy: null };

function rpLastDay() { const ds = S.sets.filter(s => !s.del && s.date <= today()).map(s => s.date).sort(); return ds.length ? ds[ds.length - 1] : today(); }
// 同じ重量が続くセットはまとめる：60kg×10・10・9 / 62.5kg×8
function rpSetsLine(ss) {
  const out = [];
  ss.forEach(s => { const l = out[out.length - 1]; if (l && l.w === s.w) l.r.push(s.r); else out.push({ w: s.w, r: [s.r] }); });
  return out.map(g => `${g.w === 0 ? '自重' : num(g.w) + 'kg'}×${g.r.join('・')}`).join(' / ');
}
const rpPct = (a, b) => (b ? Math.round((a / b - 1) * 100) : null);
const rpSign = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(n);

function rpStats(key, unit) {
  const st = bucketStats(key, unit);
  const pv = unit === 'day' ? null : bucketStats(addUnit(key, unit, -1), unit);
  const ss = st.ss.slice().sort((a, b) => a.ts - b.ts);
  const prs = [];
  for (const [n, e] of Object.entries(st.byEx)) {
    const before = S.sets.filter(s => !s.del && s.ex === n && s.date < key);
    if (!before.length) continue;
    if (e.orm > 0) {
      const b = Math.max(0, ...before.map(s => e1rm(s.w, s.r)));
      if (b > 0 && e.orm > b + 0.05) prs.push({ n, txt: `1RM ${r1(e.orm)}kg`, plus: `+${r1(e.orm - b)}kg` });
    } else {
      const mr = Math.max(...ss.filter(s => s.ex === n).map(s => s.r)), b = Math.max(0, ...before.filter(s => !(s.w > 0)).map(s => s.r));
      if (b > 0 && mr > b) prs.push({ n, txt: `${mr}回`, plus: `+${mr - b}回` });
    }
  }
  const order = []; ss.forEach(s => { if (!order.includes(s.ex)) order.push(s.ex); });
  return { key, unit, st, pv, ss, prs, order,
    exs: Object.entries(st.byEx).sort((a, b) => b[1].sets - a[1].sets),
    parts: Object.entries(st.byPart).sort((a, b) => b[1] - a[1]) };
}

// ---------- 文章 ----------
function rpText(R, detail) {
  const { st, pv, unit, key } = R, L = [], label = unitLabel(key, unit);
  if (!st.ss.length) return `${label}はトレーニングの記録がありません`;
  if (!detail) return rpShort(R);
  if (unit === 'day') {
    L.push(`🏋️ ${label}のトレーニング`);
    R.order.forEach(n => {
      const x = R.ss.filter(s => s.ex === n), o = dayOrm(x);
      L.push(`・${n} ${rpSetsLine(x)}${detail && o ? `（1RM ${r1(o)}kg）` : ''}`);
    });
    L.push(`合計 ${st.ss.length}セット${st.vol ? `・総重量 ${fmtVol(st.vol)}` : ''}`);
  } else {
    L.push(`🏋️ ${label}のトレーニング報告`);
    L.push(`📅 ${st.days.size}日・${st.ss.length}セット${st.vol ? `・総重量 ${fmtVol(st.vol)}` : ''}`);
    if (pv && pv.ss.length) {
      const a = rpPct(st.ss.length, pv.ss.length), b = rpPct(st.vol, pv.vol);
      L.push(`📈 ${RP_PREV[unit]}比 日数${rpSign(st.days.size - pv.days.size)}・セット${rpSign(a)}%${b != null && st.vol ? `・総重量${rpSign(b)}%` : ''}`);
    }
    if (R.parts.length) L.push(`💪 ${detail ? R.parts.map(([p, n]) => `${p}${n}`).join('・') : R.parts.slice(0, 4).map(([p]) => p).join('・')}`);
    if (detail) R.exs.slice(0, 5).forEach(([n, e]) => L.push(`・${n} ${e.sets}セット${e.orm ? `（1RM ${r1(e.orm)}kg）` : `（${e.reps}回）`}`));
  }
  if (R.prs.length) {
    if (detail) { L.push('🏆 自己ベスト更新'); R.prs.slice(0, 6).forEach(p => L.push(`・${p.n} ${p.txt}（${p.plus}）`)); }
    else L.push(`🏆 自己ベスト更新：${R.prs[0].n} ${R.prs[0].txt}${R.prs.length > 1 ? ` ほか${R.prs.length - 1}種目` : ''}`);
  }
  if (detail && typeof hero === 'function') { const h = hero(); L.push(`⚔️ 冒険 Lv${h.lv.L}（${titleOf(h.lv.L)}）`); }
  L.push('#筋トレ #筋トレ記録');
  return L.join('\n');
}
// 短め：概略だけ。X換算280文字に必ず収める（入りきらなければ大事でない行から削る）
function rpShort(R) {
  const { st, pv, unit, key } = R, d = pd(key), y = d.getFullYear(), m = d.getMonth() + 1;
  const label = unit === 'day' ? `${m}/${d.getDate()}` : unit === 'week' ? unitLabel(key, unit).replace(/^\d+年 /, '') + 'の週'
    : unit === 'month' ? `${y}年${m}月` : unit === 'quarter' ? `${y}年Q${Math.floor((m - 1) / 3) + 1}` : `${y}年`;
  const vol = st.vol ? `・総重量${fmtVol(st.vol)}` : '';
  let names = R.order.slice(0, 3);
  const exLine = () => names.join('・') + (R.order.length > names.length ? ` ほか${R.order.length - names.length}種目` : '');
  const build = (o) => [
    unit === 'day' ? `🏋️ ${label}の筋トレ` : `🏋️ ${label}の筋トレ報告`,
    unit === 'day' ? (o.ex ? exLine() : '') : '',
    unit === 'day' ? `${st.ss.length}セット${vol}` : `📅 ${st.days.size}日・${st.ss.length}セット${vol}`,
    o.cmp && pv && pv.ss.length ? `📈 ${RP_PREV[unit]}比 セット${rpSign(rpPct(st.ss.length, pv.ss.length))}%` : '',
    o.pr && R.prs.length ? `🏆 自己ベスト更新 ${R.prs.length}種目` : '',
    o.tag ? '#筋トレ' : '',
  ].filter(Boolean).join('\n');
  const o = { ex: true, cmp: true, pr: true, tag: true };
  let t = build(o);
  while (rpXLen(t) > 280 && names.length > 1) { names = names.slice(0, -1); t = build(o); }
  for (const k of ['cmp', 'ex', 'tag', 'pr']) { if (rpXLen(t) <= 280) break; o[k] = false; t = build(o); }
  return t;
}
// X（旧Twitter）の文字数の数え方：日本語・絵文字は2、英数字は1
const rpXLen = s => [...s].reduce((a, ch) => a + (ch.codePointAt(0) > 0x10ff ? 2 : 1), 0);

// ---------- 報告画像 ----------
const RP_FONT = 'system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif';
const RPC = { text: '#e9eef3', muted: '#8d98a6', card: '#1a1f26', card2: '#222933', acc: '#ff7a1a', acc2: '#ffb066', ok: '#3ecf8e', warn: '#f5b84b', gold: '#f2c230', bar: '#5b4a3d', pbar: '#7c8da3' };
const rpImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

async function rpDraw(R, withHero) {
  const W = 1080, P = 60, IW = W - 2 * P, cv = document.createElement('canvas'); cv.width = W; cv.height = 2600 + Math.max(0, R.order.length - 8) * 92 + Math.max(0, R.prs.length - 4) * 58;
  const c = cv.getContext('2d'); c.textBaseline = 'alphabetic';
  const F = (w, px) => (c.font = `${w} ${px}px ${RP_FONT}`);
  const box = (x, y, w, h, r, fill) => { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); c.fillStyle = fill; c.fill(); };
  const fit = (s, mw) => { s = String(s); if (!mw || c.measureText(s).width <= mw) return s; while (s.length > 1 && c.measureText(s + '…').width > mw) s = s.slice(0, -1); return s + '…'; };
  const T = (s, x, y, col, al = 'left', mw) => { c.fillStyle = col; c.textAlign = al; c.fillText(fit(s, mw), x, y); };
  const { st, pv, unit, key } = R;
  let y = P;

  // 見出し（右上にキャラクター）
  let heroW = 0;
  if (withHero && typeof hero === 'function') {
    try {
      const h = hero(), im = await rpImg(drawHero(h.pl, 'happy', R.unit !== 'day' || R.prs.length ? 'biceps' : 'relax', heroSet()));
      const k = Math.min(2.2, 250 / im.naturalHeight), w = im.naturalWidth * k, hh = im.naturalHeight * k;
      c.imageSmoothingEnabled = false; c.drawImage(im, W - P - w, y - 6, w, hh); c.imageSmoothingEnabled = true;
      F(700, 26); T(`Lv${h.lv.L} ${titleOf(h.lv.L)}`, W - P - w / 2, y + hh + 22, RPC.acc2, 'center');
      heroW = w + 24;
    } catch (e) { /* キャラなしで続ける */ }
  }
  F(700, 28); T(`TRAINING REPORT ・ ${RP_KIND[unit]}レポート`, P, y + 30, RPC.acc2, 'left', IW - heroW);
  const ttl = unit === 'week' ? unitLabel(key, unit).replace(/^\d+年 /, '') : unitLabel(key, unit);
  F(800, ttl.length > 9 ? 60 : 72); T(ttl, P, y + 120, RPC.text, 'left', IW - heroW);
  F(400, 28); T(unit === 'day' ? (st.ss.length ? `${R.order.length}種目・${st.ss.length}セット` : '') : unit === 'week' ? key.slice(0, 4) + '年' : st.ss.length ? `${st.days.size}日トレーニング` : '', P, y + 166, RPC.muted);
  y += heroW ? 300 : 200;

  // 数字のタイル
  const tile = (x, w, label, val, sub, subCol) => {
    box(x, y, w, 170, 24, RPC.card);
    F(400, 26); T(label, x + 24, y + 42, RPC.muted);
    F(800, 58); T(val, x + 24, y + 112, RPC.text, 'left', w - 40);
    if (sub) { F(600, 24); T(sub, x + 24, y + 150, subCol || RPC.muted, 'left', w - 40); }
  };
  const dl = (a, b, pct) => { if (!pv || !pv.ss.length) return [pv ? `${RP_PREV[unit]} なし` : '', RPC.muted]; const d = pct ? rpPct(a, b) : a - b; return [`${RP_PREV[unit]}比 ${d > 0 ? '▲' : d < 0 ? '▼' : '±'}${Math.abs(d)}${pct ? '%' : ''}`, d > 0 ? RPC.ok : d < 0 ? RPC.warn : RPC.muted]; };
  const tw = (IW - 2 * 20) / 3;
  if (unit === 'day') {
    tile(P, tw, '種目', `${R.order.length}`, '', null);
    tile(P + tw + 20, tw, 'セット', `${st.ss.length}`, '', null);
    tile(P + 2 * (tw + 20), tw, '総重量', st.vol ? fmtVol(st.vol) : '—', R.prs.length ? `🏆 自己ベスト ${R.prs.length}` : '', RPC.gold);
  } else {
    tile(P, tw, 'トレ日数', `${st.days.size}日`, ...dl(st.days.size, pv && pv.days.size, false));
    tile(P + tw + 20, tw, 'セット', `${st.ss.length}`, ...dl(st.ss.length, pv && pv.ss.length, true));
    tile(P + 2 * (tw + 20), tw, '総重量', st.vol ? fmtVol(st.vol) : '—', ...dl(st.vol, pv && pv.vol, true));
  }
  y += 170 + 24;

  // 週：曜日ごとのトレーニング
  if (unit === 'week') {
    box(P, y, IW, 130, 24, RPC.card);
    const gw = IW / 7;
    for (let i = 0; i < 7; i++) {
      const d = addUnit(key, 'day', i), on = st.days.has(d), cx = P + gw * (i + 0.5);
      c.beginPath(); c.arc(cx, y + 58, 26, 0, Math.PI * 2); c.fillStyle = on ? RPC.ok : RPC.card2; c.fill();
      if (on) { F(800, 26); T('✓', cx, y + 67, '#06200f', 'center'); }
      F(on ? 700 : 400, 22); T('月火水木金土日'[i], cx, y + 112, on ? RPC.text : RPC.muted, 'center');
    }
    y += 130 + 24;
  }

  // 推移のグラフ（週・月・四半期・年）／その日の種目一覧（日）
  if (unit !== 'day') {
    const N = RP_N[unit], keys = Array.from({ length: N }, (_, i) => addUnit(key, unit, i - N + 1));
    let vals = keys.map(k => bucketStats(k, unit).vol), byVol = vals.some(v => v > 0);
    if (!byVol) vals = keys.map(k => bucketStats(k, unit).ss.length);
    const H = 400; box(P, y, IW, H, 24, RPC.card);
    F(700, 30); T(byVol ? '総重量の推移' : 'セット数の推移', P + 28, y + 50, RPC.text);
    const top = y + 100, bot = y + H - 56, mx = Math.max(...vals, 1), gx = (IW - 56) / N, bw = Math.min(64, gx * 0.62);
    c.fillStyle = '#2c343f'; c.fillRect(P + 28, bot, IW - 56, 2);
    keys.forEach((k, i) => {
      const v = vals[i], x = P + 28 + gx * i + (gx - bw) / 2, on = k === key, hgt = v ? Math.max(6, (v / mx) * (bot - top)) : 0;
      if (hgt) box(x, bot - hgt, bw, hgt, Math.min(10, bw / 3), on ? RPC.acc : RPC.bar);
      if (on && v) { F(800, 26); T(byVol ? fmtVol(v) : `${v}`, x + bw / 2, bot - hgt - 12, RPC.text, 'center'); }
      if (N <= 8 || i % 2 === (N - 1) % 2 || on) { F(on ? 700 : 400, 22); T(unitLabel(k, unit, true), x + bw / 2, bot + 34, on ? RPC.text : RPC.muted, 'center'); }
    });
    y += H + 24;
  } else if (R.order.length) {
    const rows = R.order, H = 76 + rows.length * 92;
    box(P, y, IW, H, 24, RPC.card);
    F(700, 30); T('種目', P + 28, y + 50, RPC.text);
    rows.forEach((n, i) => {
      const x = R.ss.filter(s => s.ex === n), o = dayOrm(x), yy = y + 76 + i * 92, pr = R.prs.some(p => p.n === n);
      F(700, 32); T(n, P + 28, yy + 38, RPC.text, 'left', IW - 300);
      if (o) { F(700, 26); T(`${pr ? '🏆 ' : ''}1RM ${r1(o)}kg`, W - P - 28, yy + 38, pr ? RPC.gold : RPC.acc2, 'right'); }
      const v = x.reduce((a, s) => a + s.w * s.r, 0);
      if (v) { F(700, 26); T(`総重量 ${fmtVol(v)}`, W - P - 28, yy + 76, RPC.text, 'right'); }
      F(400, 26); T(rpSetsLine(x), P + 28, yy + 76, RPC.muted, 'left', IW - 56 - (v ? 250 : 0));
    });
    y += H + 24;
  }

  // 部位別セット数
  if (R.parts.length) {
    const rows = R.parts.slice(0, 6), H = 80 + rows.length * 54, mx = rows[0][1];
    box(P, y, IW, H, 24, RPC.card);
    F(700, 30); T('部位別セット数', P + 28, y + 50, RPC.text);
    rows.forEach(([p, n], i) => {
      const yy = y + 80 + i * 54, bx = P + 150, bwid = IW - 150 - 110;
      F(400, 28); T(p, P + 28, yy + 30, RPC.text, 'left', 116);
      box(bx, yy + 10, bwid, 18, 9, RPC.card2); box(bx, yy + 10, Math.max(18, bwid * n / mx), 18, 9, RPC.pbar);
      F(700, 28); T(`${n}`, W - P - 28, yy + 30, RPC.text, 'right');
    });
    y += H + 24;
  }

  // よく行った種目（週以上）
  if (unit !== 'day' && R.exs.length) {
    const rows = R.exs.slice(0, 4), H = 80 + rows.length * 58;
    box(P, y, IW, H, 24, RPC.card);
    F(700, 30); T('よく行った種目', P + 28, y + 50, RPC.text);
    rows.forEach(([n, e], i) => {
      const yy = y + 80 + i * 58;
      F(600, 28); T(n, P + 28, yy + 34, RPC.text, 'left', IW - 360);
      F(400, 26); T(`${e.sets}セット${e.orm ? `・1RM ${r1(e.orm)}kg` : `・${e.reps}回`}`, W - P - 28, yy + 34, RPC.muted, 'right');
    });
    y += H + 24;
  }

  // 自己ベスト
  if (R.prs.length && unit !== 'day') {
    const rows = R.prs, H = 80 + rows.length * 58;
    box(P, y, IW, H, 24, '#2a2416');
    F(700, 30); T('🏆 自己ベスト更新', P + 28, y + 50, RPC.gold);
    rows.forEach((p, i) => {
      const yy = y + 80 + i * 58;
      F(600, 28); T(p.n, P + 28, yy + 34, RPC.text, 'left', IW - 380);
      F(700, 26); T(`${p.txt}  ${p.plus}`, W - P - 28, yy + 34, RPC.ok, 'right');
    });
    y += H + 24;
  }

  if (!st.ss.length) { F(600, 34); T('この期間の記録はありません', W / 2, y + 60, RPC.muted, 'center'); y += 120; }

  F(400, 24); T('#筋トレ記録', P, y + 30, RPC.muted); T(`${ymd().replace(/-/g, '/')} 作成`, W - P, y + 30, RPC.muted, 'right');
  y += 30 + P;

  // 背景を付けて、使った高さで切り出す
  const Hh = Math.max(1080, Math.ceil(y)), out = document.createElement('canvas'); out.width = W; out.height = Hh;
  const o = out.getContext('2d'), g = o.createLinearGradient(0, 0, W, Hh);
  g.addColorStop(0, '#16110c'); g.addColorStop(0.35, '#101317'); g.addColorStop(1, '#0c0f12');
  o.fillStyle = g; o.fillRect(0, 0, W, Hh);
  o.fillStyle = RPC.acc; o.fillRect(0, 0, W, 8);
  o.drawImage(cv, 0, 0);
  return new Promise(res => out.toBlob(res, 'image/png'));
}

// ---------- 投稿画面 ----------
function rpFiles() {
  const f = [];
  if (rp.img && rp.blob) f.push(new File([rp.blob], `training-report-${rp.unit}-${rp.key}.png`, { type: 'image/png' }));
  rp.photos.forEach(p => f.push(p.file));
  return f;
}
function rpSave(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function rpCopy(text) { try { await navigator.clipboard.writeText(text); return true; } catch (e) { return false; } }
async function rpShare(text) {
  if (rp.img && !rp.blob && rp.busy) await rp.busy;
  const files = rpFiles(), copied = await rpCopy(text);
  if (navigator.share) {
    const canFiles = files.length && navigator.canShare && navigator.canShare({ files });
    if (!files.length || canFiles) {
      try { await navigator.share(files.length ? { text, files } : { text }); if (copied && files.length) toast('文章はコピー済み。画像だけのアプリでは貼り付けてください'); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
  }
  if (rp.img && rp.blob) rpSave(rp.blob, `training-report-${rp.unit}-${rp.key}.png`);
  toast(`${rp.img && rp.blob ? '画像を保存し、' : ''}${copied ? '文章をコピーしました。投稿したいアプリに貼り付けてください' : 'この環境では共有メニューが使えません'}`);
}

function reportDialog(o) {

  rp.key = startOf(o && o.key ? o.key : rp.unit === 'day' ? rpLastDay() : hist.anchor || today(), rp.unit);

  return dialog(`<div id="rp">

    <div class="seg sm" id="rp-units">${RP_UNITS.map(([k, l]) => `<button data-rpu="${k}">${l}</button>`).join('')}</div>

    <div class="rp-prev" id="rp-prev"></div>

    <div class="row2"><button class="ghost" data-rpgo="save">画像を保存</button><button class="ghost" data-rpgo="copy">文章をコピー</button></div>
    <button class="ghost" data-rpgo="close">閉じる</button>

  </div>`, (m, close) => {

    const text = () => { ta.value = rpText(rpStats(rp.key, rp.unit), rp.detail); cnt(); };

    };

    ta.oninput = cnt;
    m.querySelector('.sheet').addEventListener('click', async e => {
      const b = e.target.closest('button'); if (!b || b.disabled) return; const d = b.dataset;
      if (d.rpu) { rp.unit = d.rpu; rp.key = startOf(rp.unit === 'day' ? rpLastDay() : rp.key, rp.unit); if (rp.key > today()) rp.key = startOf(today(), rp.unit); return all(); }
      if (d.rpn) { rp.key = addUnit(rp.key, rp.unit, +d.rpn); return all(); }
      if (d.rpd != null) { rp.detail = d.rpd === '1'; head(); return text(); }
      if (d.rpx != null) { const [p] = rp.photos.splice(+d.rpx, 1); if (p) URL.revokeObjectURL(p.url); return photos(); }

      if (d.rpgo === 'save') {

  }).then(v => {
    rp.gen++; rp.photos.forEach(p => URL.revokeObjectURL(p.url)); rp.photos = [];
    if (rp.url) { URL.revokeObjectURL(rp.url); rp.url = ''; }

}

<script>
'use strict';
/* =========================================================
   チュートリアル（使い方ガイド）
   - 初めて開いたとき：見る／スキップ を選べる（S.settings.tut.seen）
   - ヘッダーの「？」・設定の「使い方ガイド」から、やりたいことを選んで見られる
   - 実際の画面を切り替えて、説明する所を明るく抜き出して見せる（記録・データは変更しない）
   - 対象が画面にない（記録がまだない等）ときは、見本の絵で説明する
   ========================================================= */

const TUT_DEMO_EX = 'ベンチプレス';
const $q = s => document.querySelector(s);
const secByH = (root, word) => [...document.querySelectorAll(root + ' section.card')].find(s => { const h = s.querySelector('h3'); return h && h.textContent.includes(word); });

// 見本の絵（対象が画面にないときに使う）
const TM = {
  log: `<div class="tm-card"><div class="tm-h"><b>ベンチプレス</b><span class="tm-tag">1RM 80kg</span></div>
    <div class="tm-row"><span>60kg × 10回</span><span class="tm-pen">✎</span><span class="tm-x">✕</span></div>
    <div class="tm-row"><span>60kg × 9回</span><span class="tm-pen">✎</span><span class="tm-x">✕</span></div></div>`,
  day: `<div class="tm-card"><div class="tm-h"><b>11/26(水)</b><span class="tm-tag">総重量 3.2t</span></div>

function tutDemoEx() {

  const n = recentExNames(12).find(x => !['自重', 'チューブ'].includes(exInfo(x).equip)) || TUT_DEMO_EX;

  cur.ex = n;

}

    { tab: 'game', setup: () => { gtab = 'boss'; }, sel: '#view-game .bosscard .wr', t: '手ごたえと気合', b: '「手ごたえ」で勝てそうかが分かります。<b>気合</b>は必殺技に使うゲージで、<b>今日4セットごとに1つ</b>たまった状態で始まります。' },
    { t: '1ターンごとに行動を選ぶ', b: '<b>こうげき</b>：ダメージ＋気合1 ／ <b>ぼうぎょ</b>：受けるダメージ半減＋気合2 ／ <b>必殺技</b>：気合が3つたまると使える大ダメージ。いちばん鍛えた部位で技の名前が変わります。', mock: TM.acts },
    { t: '力をためたら、ぼうぎょ', b: 'ボスが<b>「力をためている」</b>と、次のターンに強い攻撃が来ます。そのときは<b>ぼうぎょ</b>でダメージを大きく減らせます（気合もたまります）。', mock: TM.blog },
    { t: '勝ち負けのルール', b: '<b>15ターン以内</b>にボスのHPを0にすれば勝ち。負けたり時間切れでも、<b>与えたダメージはボスに残る</b>ので（HPは回復しない）、次の日に続きから戦えます。' },
    { tab: 'game', setup: () => { gtab = 'boss'; }, sel: '#view-game .blist', t: 'ボス一覧', b: '倒したボスともらった装備、次のボスが分かります。' },
  ] },

  { id: 'sync', g: '設定', icon: '☁️', name: 'Google Drive 同期とデータ', steps: [
    { tab: 'settings', sel: '#badge', t: '同期の状態', b: '右上に同期の状態が出ます。<b>「未同期」や「タップで同期」</b>のときはタップすると同期します。ログインは約1時間で切れるので、そのときもここをタップします。' },
    { tab: 'settings', sel: () => secByH('#view-settings', 'Google Drive'), t: 'Googleに接続', b: '記録はまず端末に保存され、Googleに接続すると<b>マイドライブ</b>に保存して、ほかの端末と同じ記録を使えます。', alt: 'この版では同期は使えません。' },
    { tab: 'settings', sel: () => secByH('#view-settings', 'データ'), t: '書き出し・読み込み', b: '記録のコピー＆貼り付け、<b>CSV・JSON</b>での書き出し、JSONの読み込み（統合）ができます。' },
    { tab: 'settings', sel: () => secByH('#view-settings', '提案の設定'), t: '提案・休憩・週の目標', b: '目標回数の範囲、読み上げ、記録前の確認画面、休憩タイマーの長さ、週の目標の日数を変えられます。' },
  ] },
];
const tutTopic = id => TUT_TOPICS.find(t => t.id === id);

function tutSt() {
  const s = S.settings.tut = S.settings.tut || {};
  s.done = s.done || {};
  return s;
}

// ---------- 実行 ----------
let TUT = null;
function tutStart(id) {
  const tp = tutTopic(id); if (!tp) return;
  if (TUT) tutEnd(false);
  TUT = { tp, i: 0, keep: { tab, ex: cur.ex, w: cur.w, r: cur.r, pick: pick.tab, gtab: typeof gtab !== 'undefined' ? gtab : null, hu: hist.unit, ha: hist.anchor, y: window.scrollY } };
  const ov = document.createElement('div');
  ov.id = 'tut'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', '使い方：' + tp.name);
  ov.innerHTML = '<div class="tut-hole"></div><div class="tut-bub" tabindex="-1"></div>';
  document.body.appendChild(ov);
  ov.addEventListener('click', e => {
    e.stopPropagation();
    const b = e.target.closest('[data-tb]'); if (!b) return;
    const a = b.dataset.tb;
    if (a === 'next') { if (TUT.i < TUT.tp.steps.length - 1) { TUT.i++; tutShow(); } else tutEnd(true); }
    if (a === 'prev' && TUT.i > 0) { TUT.i--; tutShow(); }
    if (a === 'close') tutEnd(TUT.i >= TUT.tp.steps.length - 1);
    if (a === 'menu') { tutEnd(true); tutMenu(); }
  });
  document.addEventListener('keydown', tutKey);
  window.addEventListener('resize', tutPlace);
  tutShow();
}
function tutKey(e) {
  if (!TUT) return;
  if (e.key === 'Escape') tutEnd(false);
  if (e.key === 'ArrowRight') { const b = $q('#tut [data-tb="next"]'); if (b) b.click(); }
  if (e.key === 'ArrowLeft') { const b = $q('#tut [data-tb="prev"]'); if (b) b.click(); }
}
function tutTarget(st) {
  if (!st.sel) return null;
  const el = typeof st.sel === 'function' ? st.sel() : $q(st.sel);
  if (!el) return null;
  const r = el.getBoundingClientRect();
  return r.width > 0 && r.height > 0 ? el : null;
}
function tutShow() {
  const st = TUT.tp.steps[TUT.i], n = TUT.tp.steps.length, last = TUT.i === n - 1;
  if (st.tab || st.setup) {
    if (st.setup) st.setup();
    if (st.tab) tab = st.tab;
    render();
  }
  const el = tutTarget(st);
  if (el) {
    const r = el.getBoundingClientRect();
    const fixed = getComputedStyle(el).position === 'fixed' || el.closest('nav,#hud');
    if (!fixed && (r.top < 60 || r.bottom > innerHeight - 90)) el.scrollIntoView({ block: 'center' });
  } else if (st.tab) window.scrollTo(0, 0);
  TUT.el = el;
  const useMock = st.mock && (!el || !st.sel || st.always);
  const note = !el && st.sel ? (st.alt || '') : '';
  const bub = $q('#tut .tut-bub');
  bub.innerHTML = `<div class="tut-top"><span class="tut-cnt">${esc(TUT.tp.icon)} ${TUT.i + 1} / ${n}</span><button class="tut-x" data-tb="close" aria-label="チュートリアルを終わる">✕</button></div>
    <h3>${esc(st.t)}</h3><p>${st.b}</p>${note ? `<p class="tut-note">${esc(note)}</p>` : ''}${useMock ? `<div class="tut-mock" aria-hidden="true">${st.mock}</div>` : ''}
    <div class="tut-dots" aria-hidden="true">${Array.from({ length: n }, (_, k) => `<i class="${k === TUT.i ? 'on' : k < TUT.i ? 'done' : ''}"></i>`).join('')}</div>
    <div class="tut-btns"><button class="ghost" data-tb="prev" ${TUT.i ? '' : 'disabled'}>戻る</button>${last
      ? `<button class="primary" data-tb="next">おわり</button>`
      : `<button class="primary" data-tb="next">次へ</button>`}</div>
    ${last ? '<button class="tut-more" data-tb="menu">ほかの使い方を見る</button>' : `<button class="tut-skip" data-tb="close">${TUT.tp.id === 'intro' ? 'スキップ' : 'やめる'}</button>`}`;
  requestAnimationFrame(() => requestAnimationFrame(() => { tutPlace(); const nb = bub.querySelector('[data-tb="next"]'); if (nb) nb.focus({ preventScroll: true }); }));
}
function tutPlace() {
  if (!TUT) return;
  const hole = $q('#tut .tut-hole'), bub = $q('#tut .tut-bub'); if (!hole || !bub) return;
  const el = TUT.el && document.contains(TUT.el) ? TUT.el : null;
  if (!el) { hole.classList.add('off'); bub.classList.remove('top'); bub.classList.add('mid'); return; }
  const r = el.getBoundingClientRect(), p = 6;
  const top = Math.max(2, r.top - p), bot = Math.min(innerHeight - 2, r.bottom + p);
  hole.classList.remove('off');
  Object.assign(hole.style, { left: Math.max(2, r.left - p) + 'px', top: top + 'px', width: (Math.min(innerWidth - 2, r.right + p) - Math.max(2, r.left - p)) + 'px', height: Math.max(8, bot - top) + 'px' });
  bub.classList.remove('mid');
  // 明るくした所と重ならない側（上か下）に説明を出す
  const room = { up: top, down: innerHeight - bot };
  bub.classList.toggle('top', room.up > room.down);
}
function tutEnd(done) {
  if (!TUT) return;
  const { keep, tp } = TUT;
  const s = tutSt(); s.seen = 1; if (done) s.done[tp.id] = 1; save();
  TUT = null;
  const ov = $q('#tut'); if (ov) ov.remove();
  document.removeEventListener('keydown', tutKey);
  window.removeEventListener('resize', tutPlace);
  cur.ex = keep.ex; cur.w = keep.w; cur.r = keep.r; pick.tab = keep.pick;
  if (keep.gtab != null) gtab = keep.gtab;
  hist.unit = keep.hu; hist.anchor = keep.ha; tab = keep.tab;
  render(); window.scrollTo(0, keep.y);
  if (done && tp.id === 'intro') toast('「？」からいつでも使い方を見られます');
}

// ---------- やりたいことから選ぶ ----------
function tutMenu() {
  const s = tutSt(), groups = [...new Set(TUT_TOPICS.map(t => t.g))];
  return dialog(`<h3>📘 使い方ガイド</h3><p class="muted small">やりたいことを選ぶと、実際の画面で説明します。</p>
    ${groups.map(g => `<div class="tut-g">${esc(g)}</div><div class="tut-list">${TUT_TOPICS.filter(t => t.g === g).map(t => `<button class="tut-item" data-tt="${t.id}"><span class="ic">${t.icon}</span><span class="nm">${esc(t.name)}<small>${t.steps.length}ステップ</small></span>${s.done[t.id] ? '<span class="ok" aria-label="見た">✓</span>' : '<span class="go">▶</span>'}</button>`).join('')}</div>`).join('')}
    <button class="ghost" data-tt="0">閉じる</button>`,
  (m, close) => {
    m.querySelector('.sheet').onclick = e => {
      const b = e.target.closest('[data-tt]'); if (!b) return;
      close(null);
      if (b.dataset.tt !== '0') setTimeout(() => tutStart(b.dataset.tt), 30);
    };
  });
}

// ---------- 初めて開いたとき ----------
function tutWelcome() {
  const back = S.sets.some(s => !s.del);
  let pic = '';
  try { pic = charSvg(hero().pl, 'tut-hero', 'biceps'); } catch (e) { /* 絵なしで続行 */ }
  return dialog(`<div class="tut-wel">${pic}
    <h3>${back ? '使い方ガイドができました' : 'ようこそ！'}</h3>
    <p>${back ? '画面の見方や、記録の直し方・バトルのルールなどを、実際の画面で案内します。' : '筋トレを記録して、キャラクターを育てよう。<br>最初に、基本の使い方を1分ほどで案内します。'}</p>
    <button class="primary" data-w="go">${back ? '基本の案内を見る' : '使い方を見る'}</button>
    <button class="ghost" data-w="menu">やりたいことを選んで見る</button>
    <button class="ghost" data-w="skip">スキップしてそのまま使う</button>
    <p class="muted small">あとで、右上の「？」や設定からいつでも見られます。</p></div>`,
  (m, close) => {
    m.querySelector('.sheet').onclick = e => {
      const b = e.target.closest('[data-w]'); if (!b) return;
      const s = tutSt(); s.seen = 1; save();
      close(null);
      if (b.dataset.w === 'go') setTimeout(() => tutStart('intro'), 30);
      if (b.dataset.w === 'menu') setTimeout(tutMenu, 30);
    };
  }).then(() => { const s = tutSt(); if (!s.seen) { s.seen = 1; save(); } });
}

// 設定画面の「使い方ガイド」
function tutCardHtml() {
  const s = tutSt(), n = TUT_TOPICS.filter(t => s.done[t.id]).length;
  return `<section class="card"><h3>📘 使い方ガイド <small class="muted">${n}/${TUT_TOPICS.length} 見た</small></h3>
    <p class="muted small">種目の選び方・記録の直し方・履歴の見方・報告・バトルなど、やりたいことを選んで、実際の画面で説明を見られます。</p>
    <div class="row2" style="grid-template-columns:1fr 1.5fr"><button class="ghost" data-tut="intro">はじめての案内</button><button class="primary" data-tut="menu" style="margin-top:10px;font-size:15px">やりたいことから選ぶ</button></div></section>`;
}

function tutInit() {
  const hud = $q('#hud');
  if (hud && !$q('#tut-help')) {
    const b = document.createElement('button');
    b.id = 'tut-help'; b.type = 'button'; b.textContent = '？'; b.setAttribute('aria-label', '使い方ガイド');
    hud.appendChild(b);
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('#tut-help,[data-tut]'); if (!b) return;
    if (b.id === 'tut-help' || b.dataset.tut === 'menu') return tutMenu();
    tutStart(b.dataset.tut);
  });
  if (tab === 'settings') render();
  // OAuth から戻った直後や、ほかの画面を開いているときは出さない
  if (!tutSt().seen && !window.TL_AUTH_BACK && $q('#modal').hidden) setTimeout(() => { if ($q('#modal').hidden && !TUT) tutWelcome(); }, 500);
}
if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', tutInit); else tutInit();
}
</script>

</body>
</html>
